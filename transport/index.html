function guardarPrefactura(){
  var sel=_pfWiz.lineas.filter(function(l){return l.checked;});
  var items=sel.map(function(l){
    var v=_pfEfectivo(l);
    var lBase=Object.assign({},l,{valorManual:null});
    return {id:l.id,tipo:l.tipo||'servicio',descripcion:l.descripcion||null,
      jornadaId:l.jornadaId,vuelaNum:l.vuelaNum,hr:l.hr,fecha:l.fecha,fechaISO:l.fechaISO,
      patente:l.patente,ruta_origen:l.ruta_origen,ruta_destino:l.ruta_destino,
      numero_vuelta:l.numero_vuelta,total_vueltas:l.total_vueltas,sucursales:l.sucursales,km:l.km,
      tuvo_ayudante:l.tuvo_ayudante,tuvo_ayudante_adicional:l.tuvo_ayudante_adicional,
      valorCalc:l.valorCalc,valorManual:l.valorManual,valor:v,
      ayuJornadaBaked:l.ayuJornadaBaked||0,ayu2JornadaBaked:l.ayu2JornadaBaked||0,
      editado:l.valorManual!==null&&l.valorManual!==_pfEfectivo(lBase)};
  });
  var neto=items.reduce(function(s,it){return s+it.valor;},0);
  var campos={numero:_pfWiz.numero,clienteId:_pfWiz.clienteId,contratoId:_pfWiz.contratoId,
    fechaEmision:_pfWiz.fechaEmision,periodoDesde:_pfWiz.periodoDesde,periodoHasta:_pfWiz.periodoHasta,
    items:items,neto:neto,notas:_pfWiz.notas,
    incluirMemoria:_pfWiz.incluirMemoria||false,
    comps:Object.assign({},_pfWiz.comps),
    colConfig:(_pfWiz.colConfig||[]).map(function(c){return Object.assign({},c);})};
  if(_pfWiz.editId){
    var existing=DB.prefacturas.find(function(x){return x.id===_pfWiz.editId;});
    if(existing){
      var oldItems=existing.items||[];
      Object.assign(existing,campos,{updatedAt:Date.now()});
      savePrefactura(existing);
      _pfMarcarJornadas(oldItems,'pendiente',null,null)
        .then(function(){return _pfMarcarJornadas(items,'en_prefactura',existing.numero,existing.id);})
        .catch(function(e){console.error('[PF] Error actualizando jornadas:',e);});
    }
  }else{
    var pf=Object.assign({id:'pf'+Date.now(),estado:'borrador',creadoEn:Date.now()},campos);
    DB.prefacturas.unshift(pf);savePrefactura(pf);
    _pfMarcarJornadas(items,'en_prefactura',pf.numero,pf.id).catch(function(e){console.error('[PF] Error marcando jornadas:',e);});
  }
  document.getElementById('pf-overlay').remove();renderFact();
}
/* ── Generación de documentos ── */
function _checkEmpresa(){
  var e=DB.empresa||{};
  var miss=[];
  if(!e.nombre)miss.push('Nombre empresa');
  if(!e.rut)miss.push('RUT');
  if(!e.responsable)miss.push('Nombre del Responsable');
  if(miss.length){
    alert('Faltan datos de la empresa en Administración → Empresa:\n• '+miss.join('\n• '));
    return false;
  }
  return true;
}
function _pfNombreArchivo(pf,tipo,ext){
  var cl=DB.clientes.find(function(c){return c.id===pf.clienteId;})||{nombre:'cliente'};
  var nom=cl.nombre.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s]/g,'').replace(/\s+/g,'_').slice(0,20);
  var per=(pf.periodoDesde||'').replace(/-/g,'');
  return tipo+'_'+pf.numero+'_'+nom+(per?'_'+per:'')+'.'+ext;
}
function _pdfLogoSize(maxW,maxH){
  var aspect=DB.empresa.logoAspect||3;
  var w=maxW,h=w/aspect;
  if(h>maxH){h=maxH;w=h*aspect;}
  return{w:w,h:h};
}
function _pdfEncabezado(doc,pf,titulo){
  var e=DB.empresa||{};
  var cl=DB.clientes.find(function(c){return c.id===pf.clienteId;})||{nombre:'—'};
  var ct=DB.contratos.find(function(c){return c.id===pf.contratoId;})||{nombre:'—'};
  var W=doc.internal.pageSize.getWidth();
  var margin=14;
  // Logo (esquina superior derecha)
  if(e.logoBase64){
    try{var ls=_pdfLogoSize(50,18);doc.addImage(e.logoBase64,'JPEG',W-14-ls.w,10,ls.w,ls.h,'','FAST');}catch(err){}
  }
  // Título
  doc.setFontSize(18);doc.setTextColor(30,58,95);doc.setFont('helvetica','bold');
  doc.text(titulo,margin,20);
  doc.setFontSize(10);doc.setTextColor(102,102,102);doc.setFont('helvetica','normal');
  doc.text('N° '+pf.numero+'   Fecha: '+fmt(pf.fechaEmision||''),margin,27);
  // Línea separadora
  doc.setDrawColor(30,58,95);doc.setLineWidth(0.5);
  doc.line(margin,31,W-margin,31);
  // Bloque emisor / cliente
  var y=37;
  doc.setFontSize(8);doc.setTextColor(102,102,102);doc.setFont('helvetica','bold');
  doc.text('EMISOR',margin,y);
  doc.text('CLIENTE',W/2+2,y);
  doc.setLineWidth(0.2);doc.setDrawColor(200,200,200);
  doc.line(W/2,y-4,W/2,y+28);
  var leftLines=[
    [e.nombre||'','bold'],[e.rut||'','normal'],[e.giro||'','normal'],
    [e.direccion||'','normal'],[e.responsable||'','normal'],[e.telefono||'','normal'],[e.email||'','normal']
  ];
  var rightLines=[
    [cl.nombre||'','bold'],[cl.rut||'','normal'],[cl.giro||'','normal'],
    [cl.direccion||'','normal'],[cl.responsable||'','normal'],[cl.telefono||'','normal'],[cl.email||'','normal']
  ];
  y+=5;
  leftLines.forEach(function(row){
    if(!row[0])return;
    doc.setFont('helvetica',row[1]);doc.setFontSize(9);doc.setTextColor(30,30,30);
    doc.text(String(row[0]),margin,y);y+=4.5;
  });
  y=42;
  rightLines.forEach(function(row){
    if(!row[0])return;
    doc.setFont('helvetica',row[1]);doc.setFontSize(9);doc.setTextColor(30,30,30);
    doc.text(String(row[0]),W/2+2,y);y+=4.5;
  });
  // Período
  var yP=75;
  doc.setFillColor(247,250,252);doc.roundedRect(margin,yP-4,W-margin*2,9,2,2,'F');
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(60,60,60);
  var perTxt='Período de servicios: '+fmt(pf.periodoDesde||'')+(pf.periodoHasta?' al '+fmt(pf.periodoHasta):'');
  doc.text(perTxt,margin+3,yP+2);
  return 86; // y donde empieza la tabla
}
function _pdfFooter(doc,pf){
  var e=DB.empresa||{};
  var W=doc.internal.pageSize.getWidth();
  var H=doc.internal.pageSize.getHeight();
  var n=doc.internal.getNumberOfPages();
  for(var i=1;i<=n;i++){
    doc.setPage(i);
    doc.setDrawColor(200,200,200);doc.setLineWidth(0.2);
    doc.line(14,H-12,W-14,H-12);
    doc.setFontSize(8);doc.setTextColor(150,150,150);doc.setFont('helvetica','normal');
    doc.text('N° '+pf.numero+' — '+(e.nombre||''),14,H-7);
    doc.text('Página '+i+' de '+n,W-14,H-7,{align:'right'});
  }
}
function generarPdfPrefactura(pf){
  if(!_checkEmpresa())return;
  loadPDF(function(){
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
    var W=doc.internal.pageSize.getWidth();
    var margin=14;
    var startY=_pdfEncabezado(doc,pf,'PREFACTURA');
    // Tabla
    var defCols=[{id:'Fecha',on:true},{id:'Vueltas',on:true},{id:'Doc.',on:true},{id:'Patente',on:true}];
    var colCfg=(pf.colConfig||defCols).filter(function(c){return c.on;});
    var getters={
      'Doc.':function(it){return it.hr||'—';},
      'Fecha':function(it){return it.fecha||'—';},
      'Vueltas':function(it){return it.numero_vuelta!=null?String(it.numero_vuelta):(it.total_vueltas?'1–'+it.total_vueltas:'—');},
      'Patente':function(it){return it.patente||'—';}
    };
    var head=[colCfg.map(function(c){return c.id;}).concat(['Valor'])];
    var body=(pf.items||[]).map(function(it){
      if(it.tipo==='extra'){
        var row=colCfg.map(function(c){
          if(c.id==='Fecha')return it.fecha||'—';
          if(c.id==='Vueltas')return 'Ay. Adicional';
          if(c.id==='Doc.')return it.hr||'—';
          if(c.id==='Patente')return it.patente||'—';
          return '';
        });
        row.push('$'+Number(it.valor||0).toLocaleString('es-CL'));
        return row;
      }
      var row=colCfg.map(function(c){return getters[c.id]?getters[c.id](it):'';});
      row.push('$'+Number(it.valor||0).toLocaleString('es-CL'));
      return row;
    });
    doc.autoTable({
      head:head,body:body,startY:startY,margin:{left:margin,right:margin},
      styles:{fontSize:9,cellPadding:2.5,lineColor:[220,220,220],lineWidth:0.2},
      headStyles:{fillColor:[30,58,95],textColor:[255,255,255],fontStyle:'bold',fontSize:9},
      alternateRowStyles:{fillColor:[247,250,252]},
      columnStyles:{[head[0].length-1]:{halign:'right'}},
      didParseCell:function(data){if(data.row.raw&&data.row.raw[0]&&data.row.raw[0].indexOf&&data.row.raw[0].indexOf('Adicional')>-1){data.cell.styles.textColor=[83,74,183];data.cell.styles.fontStyle='italic';}}
    });
    var finalY=doc.lastAutoTable.finalY+6;
    // Total
    doc.setFontSize(12);doc.setFont('helvetica','bold');doc.setTextColor(30,58,95);
    doc.text('Total Neto (sin impuestos):  $'+Number(pf.neto||0).toLocaleString('es-CL'),W-margin,finalY,{align:'right'});
    doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(130,130,130);
    doc.text('Valor neto de impuestos a facturar',W-margin,finalY+4.5,{align:'right'});
    // Observaciones
    if(pf.notas){
      finalY+=12;
      doc.setFontSize(8);doc.setTextColor(130,130,130);doc.setFont('helvetica','bold');
      doc.text('Observaciones:',margin,finalY);
      doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(60,60,60);
      var lines=doc.splitTextToSize(pf.notas,W-margin*2);
      doc.text(lines,margin,finalY+5);
      finalY+=5+lines.length*5;
    }
    // Espacio firma
    finalY+=14;
    if(finalY>240){doc.addPage();finalY=20;}
    doc.setLineDash([1,1]);doc.setDrawColor(150,150,150);doc.setLineWidth(0.3);
    doc.line(margin,finalY,W/2-10,finalY);
    doc.setLineDash([]);
    doc.setFontSize(8);doc.setTextColor(130,130,130);
    doc.text('Firma y autorización del cliente',margin,finalY+4);
    doc.text('Fecha: _______________',W/2-10+5,finalY+4);
    _pdfFooter(doc,pf);
    doc.save(_pfNombreArchivo(pf,'Prefactura','pdf'));
  });
}
function generarPdfMemoria(pf){
  if(!_checkEmpresa())return;
  var ct=DB.contratos.find(function(c){return c.id===pf.contratoId;})||{};
  loadPDF(function(){
    try{
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
    var W=doc.internal.pageSize.getWidth();
    var margin=14;
    var y=_pdfEncabezado(doc,pf,'MEMORIA DE CÁLCULO');
    // Agrupar items por jornadaId
    var items=(pf.items||[]).filter(function(it){return it.tipo!=='extra';});
    var jornadaIds=[],byJ={};
    (pf.items||[]).forEach(function(it){
      if(!byJ[it.jornadaId]){byJ[it.jornadaId]=[];jornadaIds.push(it.jornadaId);}
      byJ[it.jornadaId].push(it);
    });
    // Pre-computar subtotales recalculados para el header de cada jornada
    var jSubCalcMap={};
    var totalNetoCalc=0;
    jornadaIds.forEach(function(jid){
      var lines=byJ[jid];
      var jsc=0;
      lines.forEach(function(it){
        if(it.tipo==='extra'){jsc+=it.valor||0;return;}
        if(!(it.valorCalc!=null||it.valor))return;
        var res=it.calcData;
        if(!res){
          var j=DB.jornadas.find(function(x){return x.id===it.jornadaId;});
          var jorCtx=j?j:{vueltas:Array(it.total_vueltas||1).fill({fase3Done:true})};
          var numVuelta=it.numero_vuelta||it.vuelaNum||it.num||null;
          var sucsN=it.sucursales?Math.max(0,Math.floor(Number(it.sucursales))):0;
          var sucs=sucsN?Array(sucsN).fill('x').join(', '):'';
          res=calcularValorServicio(Object.assign({},it,{num:numVuelta,sucs:sucs}),jorCtx,ct,it.total_vueltas);
        }
        var cb=res.componente_b,cc=res.componente_c,cd2=res.componente_d;
        var ceA=res.componente_e.ayudante,ceA2=res.componente_e.ayudante_adicional;
        var vA=ceA.aplica&&ceA.valor>0?ceA.valor:(ceA.tipo_cobro==='por_jornada'?(it.ayuJornadaBaked||0):0);
        var vA2=ceA2.aplica&&ceA2.valor>0?ceA2.valor:(ceA2.tipo_cobro==='por_jornada'?(it.ayu2JornadaBaked||0):0);
        jsc+=res.valor_base+(cb.aplica&&cb.valor>0?cb.valor:0)+(cc.aplica&&cc.valor>0?cc.valor:0)+(cd2.aplica&&cd2.valor>0?cd2.valor:0)+vA+vA2;
      });
      jSubCalcMap[jid]=jsc;
      totalNetoCalc+=jsc;
    });
    jornadaIds.forEach(function(jid){
      var lines=byJ[jid];
      var first=lines[0];
      // Header del documento
      if(y>250){doc.addPage();y=20;}
      doc.setFillColor(247,250,252);doc.setDrawColor(30,58,95);doc.setLineWidth(3);
      doc.line(margin,y,margin,y+8);
      doc.setLineWidth(0.2);doc.rect(margin+4,y-1,W-margin-18,10,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(30,58,95);
      doc.text('Doc. '+(first.hr||'—')+'   '+escH(first.fecha||'')+'   Patente: '+(first.patente||'—'),margin+6,y+5.5);
      doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(30,58,95);
      doc.text('Subtotal: $'+(jSubCalcMap[jid]||0).toLocaleString('es-CL'),W-margin,y+5.5,{align:'right'});
      y+=13;
      // Por cada servicio
      var svcLines=lines.filter(function(it){return it.tipo!=='extra';});
      svcLines.forEach(function(it){
        var j=DB.jornadas.find(function(x){return x.id===it.jornadaId;});
        var subTit=it.numero_vuelta!=null?'Vuelta '+it.numero_vuelta:'Servicio';
        if(y>248){doc.addPage();y=20;}
        doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(83,74,183);
        doc.text(subTit,margin+6,y);y+=5;
        // Tabla de componentes
        var res=it.calcData;
        if(!res){
          var numVuelta2=it.numero_vuelta||it.vuelaNum||it.num||null;
          var sucsN2=it.sucursales?Math.max(0,Math.floor(Number(it.sucursales))):0;
          var sucs2=sucsN2?Array(sucsN2).fill('x').join(', '):'';
          res=calcularValorServicio(Object.assign({},it,{num:numVuelta2,sucs:sucs2}),j?j:{vueltas:Array(it.total_vueltas||1).fill({fase3Done:true})},ct,it.total_vueltas);
        }
        var compRows=[],totalMemoria=0;
        if(it.valorCalc!=null||it.valor){
          var cb=res.componente_b,cc=res.componente_c,cd2=res.componente_d;
          var ceA=res.componente_e.ayudante,ceA2=res.componente_e.ayudante_adicional;
          compRows=[];totalMemoria=0;
          compRows.push(['Comp. A — Tarifa base',res.componente_a.racional,'$'+Number(res.valor_base).toLocaleString('es-CL')]);totalMemoria+=res.valor_base;
          if(cb.aplica&&cb.valor>0){compRows.push(['Comp. B — N° de vueltas',cb.racional,'$'+Number(cb.valor).toLocaleString('es-CL')]);totalMemoria+=cb.valor;}
          if(cc.aplica&&cc.valor>0){compRows.push(['Comp. C — Sucursales',cc.racional,'$'+Number(cc.valor).toLocaleString('es-CL')]);totalMemoria+=cc.valor;}
          if(cd2.aplica&&cd2.valor>0){compRows.push(['Comp. D — Km recorridos',cd2.racional,'$'+Number(cd2.valor).toLocaleString('es-CL')]);totalMemoria+=cd2.valor;}
          var valorAyu=0;
          if(ceA.aplica&&ceA.valor>0){valorAyu=ceA.valor;}

          if(valorAyu>0){compRows.push(['Comp. E — Ayudante',ceA.racional,'$'+Number(valorAyu).toLocaleString('es-CL')]);totalMemoria+=valorAyu;}
          var valorAyu2=0;
          if(ceA2.aplica&&ceA2.valor>0){valorAyu2=ceA2.valor;}

          if(valorAyu2>0){compRows.push(['Comp. E — Ay. adicional',ceA2.racional,'$'+Number(valorAyu2).toLocaleString('es-CL')]);totalMemoria+=valorAyu2;}
        }
        if(compRows.length){

      });

    // Total general

/* ── Helpers ciclo de vida prefactura ── */
function _pfNeto(pf){return Number(pf.neto||pf.total||0);}
function _pfNCs(pf){
  /* backward-compat: pf.nota_credito (legacy singular) → array */
  if(pf.nota_credito&&!pf.notas_credito){
    return [{id:'nc_legacy',numero:pf.nota_credito.numero||'',fecha:pf.nota_credito.fecha||'',valor:0,foto:pf.nota_credito.foto||null}];
  }
  return pf.notas_credito||[];
}
function _pfRecalc(pf){
  pf.total_pagado=(pf.pagos||[]).reduce(function(s,p){return s+Number(p.valor||0);},0);
  pf.total_nc=_pfNCs(pf).reduce(function(s,nc){return s+Number(nc.valor||0);},0);
  pf.saldo=_pfNeto(pf)-pf.total_pagado-pf.total_nc;
}
function _pfEstadoNorm(pf){
  /* backward-compat: 'emitida' → tratada como 'facturada' */
  if(!pf.estado||pf.estado==='borrador')return 'borrador';
  if(pf.estado==='emitida')return 'facturada';
  return pf.estado;
}
var _PF_BC={borrador:'bwrn',aprobada:'bact',facturada:'bpag',pagada:'bok',pago_parcial:'bppar',pago_total:'bptot'};
var _PF_BL={borrador:'Borrador',aprobada:'Aprobada',facturada:'Facturada',pagada:'Pagada',pago_parcial:'Pago Parcial',pago_total:'Pago Total'};
function _pfEstadoDisplay(pf){
  var est=_pfEstadoNorm(pf);
  if(est==='facturada'){
    _pfRecalc(pf);
    var hp=(pf.pagos||[]).length>0;
    if(hp&&pf.saldo>0)return 'pago_parcial';
    if(hp&&pf.saldo<=0)return 'pago_total';
  }
  return est;
}
function _pfBadge(pf){
  var e=_pfEstadoNorm(pf);
  return '<span class="badge '+(_PF_BC[e]||'bwrn')+'">'+(_PF_BL[e]||'Borrador')+'</span>';
}
function _pfBadgeList(pf){
  var e=_pfEstadoDisplay(pf);
  return '<span class="badge '+(_PF_BC[e]||'bwrn')+'">'+(_PF_BL[e]||'Borrador')+'</span>';
}

async function _pfUploadFoto(file,pfId,tag){
  if(!file)return null;
  var MAX=5*1024*1024;
  if(file.size>MAX){alert('El archivo excede el límite de 5 MB. Selecciona un archivo más pequeño.');return null;}
  try{
    var isPdf=file.type==='application/pdf';
    var ext=isPdf?'pdf':'jpg';
    var path='tenants/'+TENANT_ID+'/jornadas/'+pfId+'/'+tag+'_'+Date.now()+'.'+ext;
    var ref=fbst.ref(path);
    if(isPdf){
      await ref.put(file,{contentType:'application/pdf'});
    }else{
      var compressed=await compressImage(file,1024,0.72);
      if(!compressed){alert('Error al procesar la imagen. Intenta con otro archivo.');return null;}
      await ref.put(compressed,{contentType:'image/jpeg'});
    }
    return await ref.getDownloadURL();
  }catch(e){console.error('Upload error:',e);return null;}
}

function _pfBancosHTML(selectId,otherId,curVal){
  var isOtro=!!(curVal&&_PF_BANCOS.indexOf(curVal)<0);
  var selVal=isOtro?'OTRO':(curVal||'');
  var otroVal=isOtro?curVal:'';
  return '<select id="'+selectId+'" onchange="pfPagoBancoChange(\''+selectId+'\',\''+otherId+'\')">'+
    '<option value="">— Seleccionar —</option>'+
    _PF_BANCOS.map(function(b){return '<option value="'+escH(b)+'"'+(selVal===b?' selected':'')+'>'+escH(b)+'</option>';}).join('')+

    '<input id="'+otherId+'" type="text" placeholder="Nombre del banco" style="margin-top:4px;display:'+(selVal==='OTRO'?'block':'none')+'" value="'+escH(otroVal)+'" autocomplete="off">';

  var sel=document.getElementById(selectId);

      'Doc.':function(it){return it.hr||'—';},
      'Fecha':function(it){return it.fecha||'—';},
      'Vueltas':function(it){return it.numero_vuelta!=null?String(it.numero_vuelta):(it.total_vueltas?'1–'+it.total_vueltas:'—');},
      'Patente':function(it){return it.patente||'—';}
    };
    var per=fmt(pf.periodoDesde||'')+(pf.periodoHasta?' al '+fmt(pf.periodoHasta):'');
    // Hoja 1: Prefactura
    var aoa=[];
    aoa.push([e.nombre||'']);
    aoa.push(['PREFACTURA N° '+pf.numero+' — '+fmt(pf.fechaEmision||'')]);
    aoa.push([]);
    aoa.push(['EMISOR','','CLIENTE']);
    aoa.push([e.rut||'','',cl.rut||'']);
    aoa.push([e.direccion||'','',cl.direccion||'']);
    aoa.push([e.giro||'','',cl.giro||'']);
    aoa.push([e.responsable||'','',cl.responsable||'']);
    aoa.push([]);
    aoa.push(['Período: '+per]);
    aoa.push([]);
    // Headers
    var hdrs=colCfg.map(function(c){return c.id;}).concat(['Valor']);
    aoa.push(hdrs);
    var dataStart=aoa.length;
    (pf.items||[]).forEach(function(it){
      if(it.tipo==='extra'){
        var row=colCfg.map(function(c){
          if(c.id==='Fecha')return it.fecha||'';
          if(c.id==='Vueltas')return 'Ay. Adicional';
          if(c.id==='Doc.')return it.hr||'';
          if(c.id==='Patente')return it.patente||'';
          return '';
        });
        row.push(it.valor||0);
        aoa.push(row);return;
      }
      var row=colCfg.map(function(c){return getters[c.id]?getters[c.id](it):'';});
      row.push(it.valor||0);
      aoa.push(row);
    });
    // Total
    var totalRow=colCfg.map(function(){return'';});
    totalRow[0]='Total Neto';
    totalRow.push({f:'SUM('+XLSX.utils.encode_col(colCfg.length)+(dataStart+1)+':'+XLSX.utils.encode_col(colCfg.length)+(aoa.length)+')'});
    aoa.push([]);aoa.push(totalRow);
    var ws=XLSX.utils.aoa_to_sheet(aoa);
    // Ancho de columnas
    var colW=colCfg.map(function(c){return{wch:c.id==='Fecha'?12:c.id==='Patente'?10:16};});
    colW.push({wch:14});
    ws['!cols']=colW;
    // Hoja 2: Resumen
    var ws2=XLSX.utils.aoa_to_sheet([
      ['Campo','Valor'],
      ['Empresa',e.nombre||''],['RUT',e.rut||''],['Cliente',cl.nombre||''],
      ['Contrato',ct.nombre||''],['Período',per],
      ['N° Prefactura',pf.numero],['Total Neto',pf.neto||0],
      ['Observaciones',pf.notas||'']
    ]);
    ws2['!cols']=[{wch:18},{wch:35}];
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Prefactura');
    XLSX.utils.book_append_sheet(wb,ws2,'Resumen');
    XLSX.writeFile(wb,_pfNombreArchivo(pf,'Prefactura','xlsx'));
  });
}
function generarExcelMemoria(pf){
  if(!_checkEmpresa())return;
  var ct=DB.contratos.find(function(c){return c.id===pf.contratoId;})||{};
  loadX(function(){
    var e=DB.empresa||{};
    var cl=DB.clientes.find(function(c){return c.id===pf.clienteId;})||{nombre:'—'};
    var per=fmt(pf.periodoDesde||'')+(pf.periodoHasta?' al '+fmt(pf.periodoHasta):'');
    var aoa=[];
    aoa.push([e.nombre||'']);
    aoa.push(['MEMORIA DE CÁLCULO — Prefactura N° '+pf.numero]);
    aoa.push(['Cliente: '+cl.nombre+'   Período: '+per]);
    aoa.push([]);
    var jornadaIds=[],byJ={};
    (pf.items||[]).forEach(function(it){
      if(!byJ[it.jornadaId]){byJ[it.jornadaId]=[];jornadaIds.push(it.jornadaId);}
      byJ[it.jornadaId].push(it);
    });
    var dataStart=aoa.length+1;
    var totalNetoCalc=0;
    jornadaIds.forEach(function(jid){
      var lines=byJ[jid];
      var first=lines[0];
      var jSubCalc=0;
      var jHeaderRow=['Doc. '+(first.hr||'—')+'   '+(first.fecha||'')+'   Patente: '+(first.patente||'—'),'',''];
      aoa.push(jHeaderRow);
      var svcLines=lines.filter(function(it){return it.tipo!=='extra';});
      svcLines.forEach(function(it){
        var subTit=it.numero_vuelta!=null?'Vuelta '+it.numero_vuelta:'Servicio';
        aoa.push([subTit,'','']);
        aoa.push(['Componente','Racional','Valor']);
        var res=it.calcData;
        if(!res){
          var j=DB.jornadas.find(function(x){return x.id===it.jornadaId;});
          var jorCtx=j?j:{vueltas:Array(it.total_vueltas||1).fill({fase3Done:true})};
          var numVuelta=it.numero_vuelta||it.vuelaNum||it.num||null;
          var sucsN=it.sucursales?Math.max(0,Math.floor(Number(it.sucursales))):0;
          var sucs=sucsN?Array(sucsN).fill('x').join(', '):'';
          res=calcularValorServicio(Object.assign({},it,{num:numVuelta,sucs:sucs}),jorCtx,ct,it.total_vueltas);
        }
        var cb=res.componente_b,cc=res.componente_c,cd=res.componente_d;
        var ceA=res.componente_e.ayudante,ceA2=res.componente_e.ayudante_adicional;
        aoa.push(['Comp. A — Tarifa base',res.componente_a.racional,res.valor_base]);
        if(cb.aplica&&cb.valor>0)aoa.push(['Comp. B — N° de vueltas',cb.racional,cb.valor]);
        if(cc.aplica&&cc.valor>0)aoa.push(['Comp. C — Sucursales',cc.racional,cc.valor]);
        if(cd.aplica&&cd.valor>0)aoa.push(['Comp. D — Km recorridos',cd.racional,cd.valor]);
        var valorAyu=0;
        if(ceA.aplica&&ceA.valor>0){valorAyu=ceA.valor;}
        else if(ceA.tipo_cobro==='por_jornada'&&(it.ayuJornadaBaked||0)>0){valorAyu=it.ayuJornadaBaked;}
        if(valorAyu>0)aoa.push(['Comp. E — Ayudante',ceA.racional,valorAyu]);
        var valorAyu2=0;
        if(ceA2.aplica&&ceA2.valor>0){valorAyu2=ceA2.valor;}
        else if(ceA2.tipo_cobro==='por_jornada'&&(it.ayu2JornadaBaked||0)>0){valorAyu2=it.ayu2JornadaBaked;}
        if(valorAyu2>0)aoa.push(['Comp. E — Ay. adicional',ceA2.racional,valorAyu2]);
        var totalMemoria=res.valor_base+(cb.aplica&&cb.valor>0?cb.valor:0)+(cc.aplica&&cc.valor>0?cc.valor:0)+(cd.aplica&&cd.valor>0?cd.valor:0)+valorAyu+valorAyu2;
        aoa.push(['Total '+subTit,'','$'+Number(totalMemoria||0).toLocaleString('es-CL')]);
        jSubCalc+=totalMemoria;
      });
      lines.filter(function(it){return it.tipo==='extra';}).forEach(function(it){
        aoa.push([it.descripcion||'Adicional','','$'+Number(it.valor||0).toLocaleString('es-CL')]);
        jSubCalc+=it.valor||0;
      });
      jHeaderRow[2]='Subtotal: $'+jSubCalc.toLocaleString('es-CL');
      totalNetoCalc+=jSubCalc;
      aoa.push([]);
    });
    aoa.push(['TOTAL NETO','','$'+Number(totalNetoCalc||0).toLocaleString('es-CL')]);
    var ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:32},{wch:45},{wch:16}];
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Memoria');
    XLSX.writeFile(wb,_pfNombreArchivo(pf,'MemoriaCalculo','xlsx'));
  });
}
