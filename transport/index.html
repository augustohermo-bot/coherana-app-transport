<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.wrap{max-width:540px;margin:0 auto;min-height:100vh;background:#f5f5f3}
.pad{padding:1rem}
.lbl{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.06em;margin:1.25rem 0 6px}
.lbl.t0{margin-top:0}
.req{color:#A32D2D}
.card{background:#fff;border:0.5px solid rgba(0,0,0,.1);border-radius:12px;padding:1rem;margin-bottom:10px}
.field{margin-bottom:10px}.field:last-child{margin-bottom:0}
.field label{font-size:13px;color:#888;display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;font-size:15px;padding:9px 10px;border:0.5px solid rgba(0,0,0,.2);border-radius:8px;background:#fff;color:#111}
.field textarea{min-height:60px;resize:vertical}
.field input.err{border-color:#A32D2D;background:#fff8f8}
.ferr{font-size:12px;color:#A32D2D;margin-top:3px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;display:block;margin-top:6px}
.btn-p{background:#534AB7;color:#fff}.btn-d{background:#A32D2D;color:#fff}
.btn-o{background:#fff;color:#111;border:0.5px solid rgba(0,0,0,.2)}
.btn-g{background:#1D9E75;color:#fff}.btn-wa{background:#25D366;color:#fff}
.sel-btn{width:100%;padding:9px 10px;border:0.5px solid rgba(0,0,0,.2);border-radius:8px;background:#fff;color:#111;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;text-align:left}
.sel-btn .ph{color:#888}
.dp{background:#fff;border:0.5px solid rgba(0,0,0,.2);border-radius:12px;margin-top:4px;overflow:hidden;display:none;position:relative;z-index:30}
.dp.open{display:block}
.dp input{width:100%;padding:9px 10px;border:none;border-bottom:0.5px solid rgba(0,0,0,.1);font-size:14px;background:#f5f5f3;color:#111}
.dp-list{max-height:170px;overflow-y:auto}
.dpi{padding:9px 12px;font-size:14px;cursor:pointer;color:#111;border-bottom:0.5px solid rgba(0,0,0,.07)}
.dpi:last-child{border-bottom:none}.dpi:hover{background:#f5f5f3}
.dpi .sub{font-size:11px;color:#888;margin-top:1px}
.dp-mt{padding:1rem;text-align:center;color:#888;font-size:13px}
.fuel-g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fb{padding:9px 4px;border:0.5px solid rgba(0,0,0,.2);border-radius:8px;background:#fff;cursor:pointer;text-align:center;font-size:12px;font-weight:500;color:#111}
.fb.sel{background:#EEEDFE;border-color:#534AB7;color:#3C3489}
.vsg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.vsb{padding:13px 6px;border:0.5px solid rgba(0,0,0,.2);border-radius:10px;background:#fff;cursor:pointer;text-align:center}
.vsb.sel{border-color:#534AB7;background:#EEEDFE}.vsb.done{opacity:.4;pointer-events:none}
.vsb .vn{font-size:19px;font-weight:500}.vsb.sel .vn{color:#3C3489}
.vsb .vh{font-size:11px;color:#888;margin-top:2px}
.stags{display:flex;flex-wrap:wrap;gap:5px;min-height:30px;margin-bottom:8px}
.stag{padding:4px 9px;background:#EEEDFE;border-radius:20px;font-size:12px;color:#3C3489;display:inline-flex;align-items:center;gap:3px}
.stag button{background:none;border:none;color:#534AB7;font-size:14px;cursor:pointer;padding:0;line-height:1}
.rrow{display:flex;gap:8px;margin-top:4px}
.ropt{flex:1;padding:9px;border:0.5px solid rgba(0,0,0,.2);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;text-align:center;color:#888}
.ropt.yes{background:#EAF3DE;border-color:#3B6D11;color:#27500A}.ropt.no{background:#f5f5f3;color:#111}
.pzone{border:0.5px dashed rgba(0,0,0,.2);border-radius:8px;padding:11px;text-align:center;cursor:pointer;margin-top:8px;background:#f5f5f3}
.pzone p{font-size:13px;color:#888}
.pprev{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.pthumb{width:64px;height:64px;border-radius:8px;object-fit:cover;border:0.5px solid rgba(0,0,0,.1);cursor:pointer}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.bv1{background:#E1F5EE;color:#085041}.bv2{background:#E6F1FB;color:#0C447C}.bv3{background:#FAEEDA;color:#633806}
.bdmg{background:#FCEBEB;color:#791F1F}.bok{background:#EAF3DE;color:#27500A}.bact{background:#EEEDFE;color:#3C3489}.bwrn{background:#FAEEDA;color:#633806}.bpag{background:#FBE9E7;color:#E65100}.bppar{background:#FFF8E1;color:#E65100}.bptot{background:#EAF3DE;color:#1B5E20;font-weight:600}
.fase-pip{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500;background:#f0f0ee;color:#aaa;margin-right:3px;border:0.5px solid #ddd}
.fase-pip.done{background:#EEEDFE;color:#534AB7;border-color:#AFA9EC}
.phase-hdr{background:linear-gradient(135deg,#f0efff,#eaf0ff);border-radius:12px;padding:12px 14px;margin-bottom:14px;border:0.5px solid #AFA9EC}
.phase-num{font-size:10px;font-weight:600;color:#534AB7;text-transform:uppercase;letter-spacing:.08em}
.phase-title{font-size:17px;font-weight:600;color:#3C3489;margin-top:3px}
.sbar{display:flex;gap:6px;margin-bottom:1rem}
.step{flex:1;height:3px;border-radius:2px;background:rgba(0,0,0,.1)}.step.d{background:#534AB7}.step.c{background:#AFA9EC}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 1rem;background:#fff;border-bottom:0.5px solid rgba(0,0,0,.1);position:sticky;top:0;z-index:20}
.hdr-left{display:flex;align-items:center;gap:8px}
.hdr-logo{width:28px;height:28px;border-radius:7px;overflow:hidden;flex-shrink:0}
.hdr-n{font-size:13px;font-weight:500}.hdr-r{font-size:11px;color:#888}
.log-btn{font-size:12px;padding:5px 10px;border:0.5px solid rgba(0,0,0,.2);border-radius:6px;background:none;cursor:pointer;color:#888}
.tab-bar{display:flex;background:#fff;border-bottom:0.5px solid rgba(0,0,0,.1)}
.tb{flex:1;padding:10px 4px;font-size:12px;font-weight:500;border:none;background:none;cursor:pointer;color:#888;border-bottom:2px solid transparent;white-space:nowrap}
.tb.active{color:#534AB7;border-bottom:2px solid #534AB7}
.view{display:none}.view.active{display:block}

  .wrap{max-width:960px}

}

    var doc={id:'doc'+Date.now(),numero:numero,clienteId:clienteId,empresaId:TENANT_ID,estado:'pendiente',creadoEn:nowF()};
    DB.documentos.unshift(doc);

}

async function migrarDesdeLegacy(){
  try{
    setLoading('Actualizando estructura de datos...',30);
    var legacyCfg=await fbdb.collection('config').doc('app').get();
    if(legacyCfg.exists){
      await fbdb.collection('tenants').doc(TENANT_ID).collection('config').doc('app').set(legacyCfg.data());
    }
    var legacyJ=await fbdb.collection('jornadas').get();
    var docs=legacyJ.docs;
    for(var i=0;i<docs.length;i+=200){
      var batch=fbdb.batch();
      docs.slice(i,i+200).forEach(function(d){
        batch.set(fbdb.collection('tenants').doc(TENANT_ID).collection('jornadas').doc(d.id),d.data());
      });
      await batch.commit();
    }
  }catch(e){console.error('Migration error:',e);}
}
async function loadFromFirestore(){
  setLoading('Conectando...',20);
  try{
    var cd=await fbdb.collection('tenants').doc(TENANT_ID).collection('config').doc('app').get();
    if(!cd.exists){
      await migrarDesdeLegacy();
      cd=await fbdb.collection('tenants').doc(TENANT_ID).collection('config').doc('app').get();
    }
    setLoading('Cargando datos...',55);
    if(cd.exists){
      var d=cd.data();
      if(d.usuarios)DB.usuarios=d.usuarios;
      if(d.patentes)DB.patentes=d.patentes;
      if(d.sucursales)DB.sucursales=d.sucursales;
      if(d.comms)DB.comms=d.comms;
      if(d.alertaKmJornada!=null)DB.alertaKmJornada=d.alertaKmJornada;
      if(d.alertaKmVuelta!=null)DB.alertaKmVuelta=d.alertaKmVuelta;
      if(d.empresa)DB.empresa=d.empresa;
      if(d.clientes)DB.clientes=d.clientes;
      if(d.contratos)DB.contratos=d.contratos;
      if(d.masterPin)MASTER.pin=d.masterPin;
    }
    var snap=await fbdb.collection('tenants').doc(TENANT_ID).collection('jornadas').orderBy('id','desc').limit(200).get();
    DB.jornadas=snap.docs.map(function(doc){return doc.data();});
    var pfSnap=await fbdb.collection('tenants').doc(TENANT_ID).collection('prefacturas').orderBy('creadoEn','desc').limit(500).get();
    DB.prefacturas=pfSnap.docs.map(function(doc){return doc.data();});
    var docSnap=await fbdb.collection('tenants').doc(TENANT_ID).collection('documentos').orderBy('creadoEn','desc').limit(1000).get();
    DB.documentos=docSnap.docs.map(function(doc){return doc.data();});
    setLoading('Listo',100);
    setTimeout(hideLoading,400);
    setSyncStatus(true,'Sincronizado');
    try{localStorage.setItem('sc14',JSON.stringify({usuarios:DB.usuarios,patentes:DB.patentes,sucursales:DB.sucursales,jornadas:DB.jornadas}));}catch(e){}
  }catch(e){
    console.error('Firebase error:',e);
    setLoading('Sin conexi\u00f3n. Modo local.',100);
    try{var d=localStorage.getItem('sc14');if(d){var p=JSON.parse(d);['usuarios','patentes','sucursales','jornadas'].forEach(function(k){if(p[k])DB[k]=p[k];});}}catch(e2){}
    setTimeout(hideLoading,1500);
    setSyncStatus(false,'Sin conexi\u00f3n');
  }
  document.getElementById('s-login').style.display='block';
  var ll=document.getElementById('login-logo');if(ll&&LOGO_LG_SRC)ll.src=LOGO_LG_SRC;
}

/* Image utils */
function compressImage(file,maxW,quality){
  return new Promise(function(resolve){
    var canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),img=new Image();
    var objUrl=URL.createObjectURL(file);
    img.onload=function(){
      URL.revokeObjectURL(objUrl);
      var w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      canvas.width=w;canvas.height=h;
      if(ctx)ctx.drawImage(img,0,0,w,h);
      canvas.toBlob(function(blob){resolve(blob||null);},'image/jpeg',quality||0.72);
    };
    img.onerror=function(){URL.revokeObjectURL(objUrl);resolve(null);};
    img.src=objUrl;
  });
}
async function uploadImages(files,jornadaId,tag){
  var ts=Date.now();
  var results=await Promise.all(Array.from(files).map(async function(file,i){
    try{
      var c=await compressImage(file,1024,0.72);
      if(!c)return null;
      var ref=fbst.ref('tenants/'+TENANT_ID+'/jornadas/'+jornadaId+'/'+tag+'_'+ts+'_'+i+'.jpg');
      await ref.put(c,{contentType:'image/jpeg'});
      return await ref.getDownloadURL();
    }catch(e){console.error('Upload error:',e);return null;}
  }));
  return results.filter(Boolean);
}

/* Share */
function compartirCard(cardId,filename,title){
  var el=document.getElementById(cardId);
  if(!el){alert('No se encontr\u00f3 el contenido a compartir.');return;}
  if(typeof html2canvas==='undefined'){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=function(){compartirCard(cardId,filename,title);};
    s.onerror=function(){alert('Error al cargar la librer\u00eda. Verifica tu conexi\u00f3n.');};
    document.head.appendChild(s);return;
  }
  var ov=document.createElement('div');
  ov.className='loading-overlay';
  ov.innerHTML='<div class="spin"></div><p>Generando imagen...</p>';
  document.body.appendChild(ov);
  html2canvas(el,{backgroundColor:'#ffffff',scale:2,useCORS:true,allowTaint:true,logging:false}).then(function(canvas){
    document.body.removeChild(ov);
    canvas.toBlob(function(blob){
      if(!blob){alert('No se pudo generar la imagen.');return;}
      var file=new File([blob],filename,{type:'image/png'});
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:title}).catch(function(err){
          if(err.name!=='AbortError'){
            var url=URL.createObjectURL(blob);
            var a=document.createElement('a');a.href=url;a.download=filename;
            document.body.appendChild(a);a.click();document.body.removeChild(a);
            setTimeout(function(){URL.revokeObjectURL(url);},200);
          }
        });
      }else{
        var url=URL.createObjectURL(blob);
        var a=document.createElement('a');a.href=url;a.download=filename;
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        setTimeout(function(){URL.revokeObjectURL(url);},200);
        setTimeout(function(){
          if(confirm('Imagen descargada. \u00bfAbrir WhatsApp para compartirla?')){
            window.open('https://wa.me/','_blank');
          }
        },600);
      }
    },'image/png',0.92);
  }).catch(function(err){
    document.body.removeChild(ov);
    console.error('html2canvas error:',err);
    alert('No se pudo capturar la imagen. Toma una captura de pantalla manual.');
  });
}

/* Helpers */
function toISO(){var d=new Date(),m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function fmt(iso){if(!iso)return '';var p=iso.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;}
function nowT(){return new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});}
function nowF(){return new Date().toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function toMins(t){if(!t)return -1;var p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]);}

  if(id==='ayu'){
    var condEl=document.getElementById('lbl-cond');
    var exCond=condEl&&!condEl.classList.contains('ph')?condEl.textContent:(SES.u&&SES.u.rol==='conductor'?SES.u.nombre:'');
    items=getCandidatosAyu().filter(function(u){return u.nombre!==exCond&&u.nombre.toLowerCase().indexOf(q.toLowerCase())>=0;});
  }
  if(id==='j-ayu'){
    var jCondEl=document.getElementById('lbl-j-cond');
    var exJCond=jCondEl&&!jCondEl.classList.contains('ph')?jCondEl.textContent:'';
    items=getCandidatosAyu().filter(function(u){return u.nombre!==exJCond&&u.nombre.toLowerCase().indexOf(q.toLowerCase())>=0;});
  }
  if(id==='ayu2'){
    var ja=actJ();
    var ex1=ja?ja.cond:'',ex2=ja?ja.ayu:'';
    items=getCandidatosAyu().filter(function(u){return u.nombre!==ex1&&u.nombre!==ex2&&u.nombre.toLowerCase().indexOf(q.toLowerCase())>=0;});
  }
  if(id==='suc')items=DB.sucursales.filter(function(s){return String(s.n).indexOf(q)>=0||s.addr.toLowerCase().indexOf(q.toLowerCase())>=0;});
  if(!items.length){el.innerHTML='<div class="dp-mt">Sin resultados</div>';return;}

        alert('El código "'+hr+'" ya está registrado en la jornada seleccionada. Ingresa un código diferente.');return;
      }
    }
  }
  var prevJ=DB.jornadas.filter(function(x){return x.pat===iniSt.pat&&x.estado==='cerrado'&&x.kmFin>0;})

    var j={
      id:jId,fecha:fmt(fi),fechaISO:fi,horaIni:nowT(),
      pat:iniSt.pat,hojaRuta:hr,cond:cond,ayu:ayu,clienteId:iniSt.clienteId||'',

function _addAdhocCore(pfx){

  var laEl=document.getElementById(pfx+'-lat'),loEl=document.getElementById(pfx+'-lng');

  if(fEl&&fEl.files&&fEl.files[0]){

function guardarFase3(num){
  var j=actJ();var v=actVuelta(j,num);if(!v)return;
  clrErr(['err-hl','err-kl']);
  var hl=document.getElementById('v-hl').value;
  var kl=parseInt(document.getElementById('v-kl').value)||0;
  var ok=true;
  if(!hl){setErr('err-hl','Ingresa la hora de llegada.');ok=false;}
  if(!kl){setErr('err-kl','Ingresa el km de llegada.');ok=false;}
  if(v.kmsal&&kl&&kl<=v.kmsal){setErr('err-kl','Km llegada debe ser mayor al Km de salida ('+v.kmsal+').');ok=false;}
  if(v.hsal&&hl&&toMins(hl)<toMins(v.hsal)){setErr('err-hl','Hora llegada debe ser \u2265 hora de salida ('+v.hsal+').');ok=false;}
  if(!ok)return;
  var kmRecV=kl>v.kmsal?kl-v.kmsal:0;
  if(DB.alertaKmVuelta&&kmRecV>DB.alertaKmVuelta){
    if(!confirm('⚠ Alerta de kilometraje\n\nLa vuelta registra '+kmRecV.toLocaleString('es-CL')+' km recorridos, superando el límite de '+DB.alertaKmVuelta.toLocaleString('es-CL')+' km.\n\n¿Confirmas que el kilometraje es correcto?'))return;
  }
  v.hllg=hl;v.kmllg=kl;v.kmrec=kmRecV;
  v.obs=document.getElementById('v-ob')?document.getElementById('v-ob').value:'';
  v.fase3Done=true;v.updatedAt=nowF();
  saveJornada(j);
  if(v.obs)enviarCorreoIncidencia('obs',j,v,v.obs,[]);
  renderResumenVuelta(j,v);
}

function guardarEditJ(){
  var j=actJ();if(!j)return;
  var fi=document.getElementById('ej-fecha').value;
  var km=parseInt(document.getElementById('ej-km').value)||0;
  var hr=document.getElementById('ej-hr').value.trim();
  if(!fi||!km||!hr){alert('Completa todos los campos.');return;}
  var cL=document.getElementById('lbl-j-cond'),aL=document.getElementById('lbl-j-ayu'),pL=document.getElementById('lbl-j-pat');
  var cond=(cL&&!cL.classList.contains('ph'))?cL.textContent:j.cond;
  var ayu=(aL&&!aL.classList.contains('ph'))?aL.textContent:j.ayu;
  var pat=(pL&&!pL.classList.contains('ph'))?pL.textContent:j.pat;
  var fuelEl=document.getElementById('fg-ej'),fuelIdx=-1;
  if(fuelEl){var fSel=fuelEl.querySelector('.sel');if(fSel)fuelIdx=Array.from(fuelEl.querySelectorAll('.fb')).indexOf(fSel);}
  if(fuelIdx<0){alert('Indica el combustible.');return;}
  j.fecha=fmt(fi);j.fechaISO=fi;j.hojaRuta=hr;j.kmIni=km;j.fuelIni=FUELS[fuelIdx];j.cond=cond;j.ayu=ayu;j.pat=pat;

}

function prevHr(inp){
  var MAX=5;
  var files=Array.from(inp.files).slice(0,MAX);
  if(inp.files.length>MAX)alert('Máximo '+MAX+' fotos de hoja de ruta.');
  fotoHrFiles=files;
  var el=document.getElementById('hr-prev');if(!el)return;
  var pz=document.getElementById('hr-pzone');if(pz)pz.style.display=files.length?'none':'';
  var err=document.getElementById('err-hr-photo');if(err)err.textContent='';
  el.innerHTML='';
  files.forEach(function(f){
    var img=document.createElement('img');
    var url=URL.createObjectURL(f);
    img.onload=function(){URL.revokeObjectURL(url);};
    img.src=url;img.className='pthumb';
    img.style.cssText='width:80px;height:80px';el.appendChild(img);
  });
  var cnt=document.getElementById('hr-cnt');
  if(cnt)cnt.textContent=files.length?files.length+' foto'+(files.length>1?'s':'')+' seleccionada'+(files.length>1?'s':''):'';
}
function previewCierre(){
  var kmf=parseInt(document.getElementById('f-km').value)||0;
  if(!kmf){alert('Ingresa el km final.');return;}
  if(finSt.fuelIdx<0){alert('Indica el combustible final.');return;}
  var j=actJ(),lv=lastVuelta(j);
  if(lv&&lv.kmllg&&kmf<lv.kmllg){
    var e=document.getElementById('err-fkm');
    if(e)e.textContent='El Km final debe ser \u2265 al Km de llegada de la \u00faltima vuelta ('+lv.kmllg.toLocaleString('es-CL')+').';
    return;
  }
  var errFuel=document.getElementById('err-fuel-fin');
  if(errFuel)errFuel.innerHTML='';
  var btnStyle='margin-top:6px;padding:7px 12px;background:none;border:0.5px solid #1D9E75;border-radius:8px;color:#1D9E75;font-size:12px;cursor:pointer;display:inline-block';
  var btnCarga='<br><button onclick="irACargarCombustible()" style="'+btnStyle+'">&#9981; Registrar carga de combustible</button>';
  if(finSt.fuelIdx===4){
    if(errFuel)errFuel.innerHTML='No se puede cerrar la jornada con combustible en Reserva. Debes recargar antes de finalizar.'+btnCarga;
    document.getElementById('fg-fin').scrollIntoView({behavior:'smooth'});
    return;
  }
  var fuelIniIdx=FUELS.indexOf(j.fuelIni);
  if(finSt.fuelIdx<fuelIniIdx&&!(j.cargas&&j.cargas.length)){
    if(errFuel)errFuel.innerHTML='El nivel al cierre ('+FUELS[finSt.fuelIdx]+') es mayor al del inicio ('+j.fuelIni+'). Verifica la informaci\u00f3n o registra la carga realizada.'+btnCarga;
    document.getElementById('fg-fin').scrollIntoView({behavior:'smooth'});
    return;
  }
  var kmRecJ=kmf>j.kmIni?kmf-j.kmIni:0;
  if(DB.alertaKmJornada&&kmRecJ>DB.alertaKmJornada){
    if(!confirm('⚠ Alerta de kilometraje\n\nLa jornada registra '+kmRecJ.toLocaleString('es-CL')+' km recorridos, superando el límite de '+DB.alertaKmJornada.toLocaleString('es-CL')+' km.\n\n¿Confirmas que el kilometraje es correcto?'))return;
  }
  if(!fotoHrFiles.length){
    var er=document.getElementById('err-hr-photo');
    if(er)er.textContent='Debes fotografiar la hoja de ruta antes de cerrar.';
    document.getElementById('hr-pzone').scrollIntoView({behavior:'smooth'});
    return;
  }
  tempCierre={kmFin:kmf,fuelIdx:finSt.fuelIdx,obs:document.getElementById('f-ob').value};
  renderResumenJornada(j);
}
function irACargarCombustible(){
  var kmf=parseInt((document.getElementById('f-km')||{}).value)||0;
  var obs=(document.getElementById('f-ob')||{}).value||'';
  tempCierre={kmFin:kmf,fuelIdx:finSt.fuelIdx,obs:obs};
  renderCargaCombustible();
}

async function confirmarGuardar(){
  var j=actJ();if(!j)return;
  var btn=document.querySelector('.btn-g');if(btn){btn.textContent='Obteniendo GPS...';btn.disabled=true;}
  var gps=await new Promise(function(resolve){
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        function(p){resolve({lat:p.coords.latitude.toFixed(6),lng:p.coords.longitude.toFixed(6)});},
        function(){resolve({lat:'',lng:''});},
        {timeout:5000,maximumAge:30000}
      );
    }else{resolve({lat:'',lng:''});}
  });
  if(btn)btn.textContent='Guardando...';
  setSyncStatus(false,'Guardando...');
  if(fotoHrFiles.length){
    try{
      var hrUrls=await uploadImages(fotoHrFiles,j.id,'hr_'+j.hojaRuta);
      j.fotosHojaRuta=hrUrls;

    }catch(e){j.fotosHojaRuta=[];j.fotoHojaRuta='';}
  }
  j.kmFin=tempCierre.kmFin;j.fuelFin=FUELS[tempCierre.fuelIdx];j.horaFin=nowT();

  tempCierre={kmFin:0,fuelIdx:-1,obs:''};fotoHrFiles=[];
  saveJornada(j);
  renderJornadaGuardada(j);
}

function switchPTab(tab){
  var divs={v:'pp-v',c:'pp-c',e:'pp-e'};
  var btns={v:'ptab-v',c:'ptab-c',e:'ptab-e'};
  Object.keys(divs).forEach(function(k){
    var d=document.getElementById(divs[k]);if(d)d.style.display=(k===tab)?'':'none';
    var b=document.getElementById(btns[k]);
    if(b){b.style.background=k===tab?'#EEEDFE':'none';b.style.color=k===tab?'#534AB7':'#888';}
  });
  if(tab==='v')renderTbl();
  else if(tab==='c')renderTblComb();
  else if(tab==='e')renderTblCorreos();
}

function getJornadaISO(j){
  if(j.fechaISO)return j.fechaISO;
  if(j.fecha){var p=j.fecha.split('/');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:'';}
  return '';
}
function getHRFotos(j){
  if(j.fotosHojaRuta&&j.fotosHojaRuta.length)return j.fotosHojaRuta;

  return [];
}
function esPropia(j){
  var u=SES.u;if(!u)return false;
  if(u.rol==='admin')return true;
  if(j.creadoPor)return j.creadoPor===u.id;
  return j.cond===u.nombre||j.ayu===u.nombre;
}

function _debouncedRenderTbl(){clearTimeout(_renderTblTimer);_renderTblTimer=setTimeout(renderTbl,200);}

function _regFiltrarJornadas(ffD,ffH,fpv){
  return DB.jornadas.filter(function(j){
    if(!esPropia(j))return false;
    var iso=getJornadaISO(j);
    if(ffD&&iso&&iso<ffD)return false;
    if(ffH&&iso&&iso>ffH)return false;
    if(fpv&&j.pat!==fpv)return false;
    return true;
  });
}

async function guardarEditJornadaAdm(jId){
  var j=DB.jornadas.find(function(x){return x.id===jId;});if(!j)return;
  var btn=document.getElementById('aej-save-btn');if(btn){btn.textContent='Guardando...';btn.disabled=true;}
  setSyncStatus(false,'Guardando...');
  if(admJSt.hrFiles&&admJSt.hrFiles.length){
    try{
      var hrUrls=await uploadImages(admJSt.hrFiles,j.id,'hr_'+j.hojaRuta+'_adm');
      var existing=getHRFotos(j);
      j.fotosHojaRuta=existing.concat(hrUrls);
      j.fotoHojaRuta=j.fotosHojaRuta[0]||'';
    }catch(e){console.error('HR upload admin:',e);alert('No se pudo subir la foto de hoja de ruta. Los demás cambios se guardarán igualmente.');}
  }
  var fi=(document.getElementById('aej-fecha')||{}).value;
  if(fi){j.fechaISO=fi;j.fecha=fmt(fi);}
  var hr=((document.getElementById('aej-hr')||{}).value||'').trim();if(hr)j.hojaRuta=hr;
  var pat=(document.getElementById('aej-pat')||{}).value;if(pat)j.pat=pat;
  var cond=(document.getElementById('aej-cond')||{}).value;if(cond)j.cond=cond;
  var ayu=(document.getElementById('aej-ayu')||{}).value;if(ayu)j.ayu=ayu;
  var kmini=parseInt((document.getElementById('aej-kmini')||{}).value);if(kmini)j.kmIni=kmini;
  var kmfin=parseInt((document.getElementById('aej-kmfin')||{}).value)||0;if(kmfin)j.kmFin=kmfin;
  j.kmTotal=(j.kmFin&&j.kmIni&&j.kmFin>j.kmIni)?j.kmFin-j.kmIni:j.kmTotal;
  if(admJSt.fuelIniIdx>=0)j.fuelIni=FUELS[admJSt.fuelIniIdx];
  if(admJSt.fuelFinIdx>=0)j.fuelFin=FUELS[admJSt.fuelFinIdx];
  var hini=(document.getElementById('aej-hini')||{}).value;if(hini)j.horaIni=hini;
  var hfin=(document.getElementById('aej-hfin')||{}).value;if(hfin)j.horaFin=hfin;
  j.obsCierre=(document.getElementById('aej-obs')||{}).value||'';
  saveJornada(j);
  var ov=document.getElementById('aej-overlay');if(ov)ov.remove();
  renderTbl();
}

function deleteVueltaAdm(jId,vNum){
  var btn=document.getElementById('aev-del-btn');if(!btn)return;
  if(btn.dataset.step==='confirm'){
    var j=DB.jornadas.find(function(x){return x.id===jId;});if(!j)return;
    j.vueltas=j.vueltas.filter(function(v){return v.num!==vNum;});
    saveJornada(j);
    var ov=document.getElementById('aev-overlay');if(ov)ov.remove();
    renderTbl();
  }else{
    btn.dataset.step='confirm';
    btn.textContent='¿Confirmar? Toca de nuevo para eliminar';
    setTimeout(function(){
      if(btn&&btn.dataset.step==='confirm'){delete btn.dataset.step;btn.textContent='Eliminar esta vuelta';}
    },4000);
  }
}
function deleteJornadaAdm(jId){
  var btn=document.getElementById('aej-del-btn');if(!btn)return;

    DB.jornadas=DB.jornadas.filter(function(j){return j.id!==jId;});

    btn.dataset.step='confirm';

    setTimeout(function(){
      if(btn&&btn.dataset.step==='confirm'){delete btn.dataset.step;btn.textContent='Eliminar jornada completa';}
    },4000);
  }
}
function expCSV(){
  var ffD=(document.getElementById('ff-desde')||{}).value||'';
  var ffH=(document.getElementById('ff-hasta')||{}).value||'';
  var fpv=(document.getElementById('fp-p')||{}).value||'';
  var fvv=(document.getElementById('fp-v')||{}).value||'';
  var hdr='Fecha;Doc.;Doc. Vuelta;Patente;Conductor;Ay.Jornada;Vuelta;Sucursales;Ay2;H.sal;H.llg;Km sal;Km llg;Km rec;F1;Da\u00f1o sal;Det da\u00f1o sal;Imgs da\u00f1o sal;F2;Da\u00f1o ent;Det da\u00f1o ent;Imgs da\u00f1o ent;Reclamo;Det reclamo;F3;Obs;Fotos Doc.;Actualizado';
  var rows=[];
  _regFiltrarJornadas(ffD,ffH,fpv).forEach(function(j){
    j.vueltas.forEach(function(v){
      if(fvv&&String(v.num)!==fvv)return;
      rows.push([
        j.fecha,j.hojaRuta,v.hojaRuta||'',j.pat,j.cond,j.ayu,v.num,
        '"'+v.sucs+'"',v.ayu2||'',v.hsal||'',v.hllg||'',
        v.kmsal||'',v.kmllg||'',v.kmrec||'',
        (v.fase1Done?'Si':'No'),v.ds||'','"'+(v.dscmt||'')+'"','"'+((v.imgs1||[]).join('; '))+'"',
        (v.fase2Done?'Si':'No'),v.de||'','"'+(v.decmt||'')+'"','"'+((v.imgs2||[]).join('; '))+'"',
        v.rc||'','"'+(v.rccmt||'')+'"',
        (v.fase3Done?'Si':'No'),'"'+(v.obs||'')+'"',
        '"'+getHRFotos(j).join('; ')+'"',v.updatedAt||''
      ].join(';'));
    });
  });
  if(!rows.length){alert('Sin registros para los filtros aplicados.');return;}
  var csvUrl=URL.createObjectURL(new Blob(['\uFEFF'+hdr+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));
  var a=document.createElement('a');a.href=csvUrl;a.download='coherana_captrans.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(csvUrl);},200);
}

function dlT(id){
  if(typeof XLSX==='undefined'){alert('Cargando...');return;}
  var ws,wb=XLSX.utils.book_new();
  if(id==='usr-xls')ws=XLSX.utils.aoa_to_sheet([['Nombre','Rol','PIN','Permisos'],['Juan','conductor','1234','jornada']]);
  else if(id==='pat-xls')ws=XLSX.utils.aoa_to_sheet([['Patente'],['ABCD12']]);
  else ws=XLSX.utils.aoa_to_sheet([['Numero','Direccion'],['10F','Av. Ejemplo 123'],['12','Calle Muestra 456']]);
  XLSX.utils.book_append_sheet(wb,ws,'Datos');
  XLSX.writeFile(wb,id.replace('-xls','')+'.xlsx');
}
function hXLS(id,inp){
  var file=inp.files[0];if(!file)return;
  var res=document.getElementById('ur-'+id);
  loadX(function(){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var wb=XLSX.read(e.target.result,{type:'array'});
        var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
        var count=0;
        if(id==='usr-xls'){
          rows.forEach(function(r){
            var n=String(r['Nombre']||'').trim(),rol=String(r['Rol']||'conductor').trim();
            var p=String(r['PIN']||'').trim();
            var pm=String(r['Permisos']||'jornada').split(',').map(function(x){return x.trim();});
            if(n&&p&&!DB.usuarios.find(function(x){return x.nombre===n;})){
              DB.usuarios.push({id:'u'+Date.now()+'x'+count,nombre:n,rol:rol,pin:p,mustChangePIN:true,permisos:pm});count++;
            }
          });
        }else if(id==='pat-xls'){
          rows.forEach(function(r){
            var v=String(r['Patente']||'').trim().toUpperCase();
            if(v&&DB.patentes.indexOf(v)<0){DB.patentes.push(v);count++;}
          });
        }else{
          rows.forEach(function(r){
            var n=String(r['Numero']||'').trim().toUpperCase(),a=String(r['Direccion']||'').trim();
            if(n&&a&&!DB.sucursales.find(function(s){return String(s.n).toUpperCase()===n;})){DB.sucursales.push({n:n,addr:a});count++;}
          });
          DB.sucursales.sort(function(a,b){return String(a.n).localeCompare(String(b.n),undefined,{numeric:true,sensitivity:'base'});});
        }
        saveConfig();
        res.className='ur ok';res.textContent=count+' registros importados.';
        inp.value='';setTimeout(renderAdmin,300);
      }catch(err){res.className='ur err';res.textContent='Error al leer el archivo.';}
    };
    reader.readAsArrayBuffer(file);
  });
}

function saveRegla(t){
  var dest=((document.getElementById('rc-dest')||{}).value||'').split(',').map(function(x){return x.trim();}).filter(Boolean);
  if(!dest.length){alert('Ingresa al menos un email de destinatario.');return;}

  var cuerpo=((document.getElementById('rc-cuerpo')||{}).value||'').trim();
  if(!asunto){alert('Ingresa el asunto.');return;}
  if(!cuerpo){alert('Ingresa el cuerpo del email.');return;}
  var cc=((document.getElementById('rc-cc')||{}).value||'').split(',').map(function(x){return x.trim();}).filter(Boolean);
  var linkFoto=((document.getElementById('rc-linkfoto')||{}).value||'').trim();
  var comms=getComms();
  comms.reglas[t]={activo:true,dest:dest,cc:cc,asunto:asunto,cuerpo:cuerpo,linkFoto:linkFoto};
  DB.comms=comms;saveConfig();
  var ok=document.getElementById('rc-ok');if(ok){ok.className='ur ok';ok.textContent='Regla guardada.';}

function resolverVariables(tmpl,j,v,detalle,imgs,linkFoto){
  var r=String(tmpl||'')
    .replace(/\{\{fecha\}\}/g,j.fecha||'')
    .replace(/\{\{hojaRuta\}\}/g,j.hojaRuta||'')
    .replace(/\{\{patente\}\}/g,j.pat||'')
    .replace(/\{\{conductor\}\}/g,j.cond||'')
    .replace(/\{\{ayudante\}\}/g,j.ayu||'')
    .replace(/\{\{ayudante2\}\}/g,v.ayu2||'')
    .replace(/\{\{vuelta\}\}/g,String(v.num||''))
    .replace(/\{\{sucursales\}\}/g,v.sucs||'')
    .replace(/\{\{horaSalida\}\}/g,v.hsal||'--')
    .replace(/\{\{horaLlegada\}\}/g,v.hllg||'--')
    .replace(/\{\{kmSalida\}\}/g,String(v.kmsal||'--'))
    .replace(/\{\{kmLlegada\}\}/g,String(v.kmllg||'--'))
    .replace(/\{\{kmRecorridos\}\}/g,String(v.kmrec||'--'))
    .replace(/\{\{detalle\}\}/g,detalle||'');
  var fotoUrl=imgs&&imgs.length?imgs[0]:'';
  var fl='';
  if(linkFoto&&fotoUrl)fl=linkFoto+': '+fotoUrl;
  return r.replace(/\{\{foto\}\}/g,fl);
}
function resolverVariablesHtml(tmpl,j,v,detalle,imgs,linkFoto){
  var r=String(tmpl||'')
    .replace(/\{\{fecha\}\}/g,j.fecha||'')
    .replace(/\{\{hojaRuta\}\}/g,j.hojaRuta||'')
    .replace(/\{\{patente\}\}/g,j.pat||'')
    .replace(/\{\{conductor\}\}/g,j.cond||'')
    .replace(/\{\{ayudante\}\}/g,j.ayu||'')
    .replace(/\{\{ayudante2\}\}/g,v.ayu2||'')
    .replace(/\{\{vuelta\}\}/g,String(v.num||''))
    .replace(/\{\{sucursales\}\}/g,v.sucs||'')
    .replace(/\{\{horaSalida\}\}/g,v.hsal||'--')
    .replace(/\{\{horaLlegada\}\}/g,v.hllg||'--')
    .replace(/\{\{kmSalida\}\}/g,String(v.kmsal||'--'))
    .replace(/\{\{kmLlegada\}\}/g,String(v.kmllg||'--'))
    .replace(/\{\{kmRecorridos\}\}/g,String(v.kmrec||'--'))
    .replace(/\{\{detalle\}\}/g,detalle||'');
  var fotoUrl=imgs&&imgs.length?imgs[0]:'';
  var fotoTag=linkFoto&&fotoUrl?('<a href="'+fotoUrl+'" style="color:#534AB7">'+linkFoto+'</a>'):'';
  return r.replace(/\{\{foto\}\}/g,fotoTag).replace(/\n/g,'<br>');
}
function enviarCorreoIncidencia(tipo,j,v,detalle,imgs){
  var comms=getComms();
  var r=comms.reglas&&comms.reglas[tipo];
  if(!r||!r.activo||!r.dest||!r.dest.length||!comms.gasUrl)return;
  var asunto=resolverVariables(r.asunto,j,v,detalle,imgs,r.linkFoto);
  var cuerpo=resolverVariables(r.cuerpo,j,v,detalle,imgs,r.linkFoto);
  var cuerpoHtml=resolverVariablesHtml(r.cuerpo,j,v,detalle,imgs,r.linkFoto);
  var to=r.dest.join(', '),cc=(r.cc||[]).join(', ');
  var logRef=fbdb.collection('tenants').doc(TENANT_ID).collection('emails_log').doc('el_'+Date.now()+'_'+tipo);
  logRef.set({
    tipo:tipo,tipoNombre:COMMS_TIPOS[tipo].nombre,
    fechaEnvio:nowF(),to:to,cc:cc,asunto:asunto,
    hojaRuta:j.hojaRuta,patente:j.pat,vuelta:v.num,conductor:j.cond,
    estado:'enviando'
  }).catch(function(){});
  fetch(comms.gasUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({to:to,cc:cc,subject:asunto,body:cuerpo,htmlBody:cuerpoHtml})
  })
  .then(function(){logRef.update({estado:'enviado'}).catch(function(){});})
  .catch(function(e){logRef.update({estado:'error',error:e.message||'Error de conexión'}).catch(function(){});});
}

function prevFotoGen(inp,prevId,zoneId,errId){
  var el=document.getElementById(prevId),pz=document.getElementById(zoneId);
  if(errId){var err=document.getElementById(errId);if(err)err.textContent='';}
  if(!el||!inp.files||!inp.files[0])return;
  el.innerHTML='';
  var img=document.createElement('img');
  var url=URL.createObjectURL(inp.files[0]);
  img.onload=function(){URL.revokeObjectURL(url);};
  img.src=url;img.className='pthumb';img.style.cssText='width:120px;height:90px';el.appendChild(img);
  if(pz)pz.style.display='none';
}
function calcPxL(adm){
  var p=adm?'adm-':'';
  var l=parseFloat((document.getElementById(p+'c-litros')||{}).value)||0;
  var v=parseFloat((document.getElementById(p+'c-valor')||{}).value)||0;
  var row=document.getElementById(adm?'adm-pxl-row':'c-pxl-row');
  var el=document.getElementById(adm?'adm-pxl':'c-pxl');
  if(l>0&&v>0&&row&&el){row.style.display='block';el.textContent='$'+(v/l).toLocaleString('es-CL',{maximumFractionDigits:0})+'/L';}
  else if(row)row.style.display='none';
}
async function guardarCarga(jornadaId){
  var j=DB.jornadas.find(function(x){return String(x.id)===String(jornadaId);});
  if(!j){alert('Jornada no encontrada.');return;}
  var km=parseInt((document.getElementById('c-km')||{}).value)||0;
  var litros=parseFloat((document.getElementById('c-litros')||{}).value)||0;
  var valor=parseFloat((document.getElementById('c-valor')||{}).value)||0;
  var fotoInp=document.getElementById('c-foto');
  var ok=true;
  if(!km||km<=0){setErr('err-c-km','Ingresa el km del odómetro.');ok=false;}
  if(!litros||litros<=0){setErr('err-c-litros','Ingresa los litros cargados.');ok=false;}
  if(!valor||valor<=0){setErr('err-c-valor','Ingresa el valor total de la compra.');ok=false;}
  if(!fotoInp||!fotoInp.files||!fotoInp.files[0]){setErr('err-c-foto','Debes fotografiar el comprobante.');ok=false;}
  if(!ok)return;
  var btn=document.getElementById('btn-c');if(btn){btn.textContent='Subiendo foto...';btn.disabled=true;}
  setSyncStatus(false,'Subiendo...');
  var fechaEl=document.getElementById('c-fecha'),horaEl=document.getElementById('c-hora');
  var latEl=document.getElementById('c-lat'),lngEl=document.getElementById('c-lng');
  var lat=latEl?latEl.value:'',lng=lngEl?lngEl.value:'';
  var fotoUrl='';
  try{var urls=await uploadImages(Array.from(fotoInp.files),jornadaId,'carga_v');fotoUrl=urls[0]||'';}
  catch(e){console.error('Upload voucher:',e);}
  var tipoCarga=((document.getElementById('c-tipo-carga')||{}).value||'combustible');
  var carga={
    id:Date.now(),
    fecha:fechaEl?fmt(fechaEl.value):fmt(toISO()),fechaISO:fechaEl?fechaEl.value:toISO(),
    hora:horaEl?horaEl.value:nowT(),
    lat:lat,lng:lng,
    kmOdo:km,
    tipo_carga:tipoCarga,
    litros:litros,valorTotal:valor,
    valorLitro:Math.round(valor/litros),
    fotoVoucher:fotoUrl,
    registradoPor:SES.u?SES.u.nombre:'',
    registradoEn:nowF()
  };
  if(!j.cargas)j.cargas=[];
  j.cargas.push(carga);
  saveJornada(j);
  renderResumenCarga(j,carga,false);
}

var _ctEdit=null,_ctStep=1,_ctActiveTar=null,_ctRutaEdit=null;

function _emptyTarifario(){
  return {valor_base:0,comp_b:[],comp_c:[],comp_d:[],
    comp_e:{
      ayudante:{incluido_en_base:true,tipo_cobro:'por_vuelta',valor_por_jornada:0,config_por_vuelta:[],valor_default_por_vuelta:0},
      ayudante_adicional:{incluido_en_base:true,tipo_cobro:'por_vuelta',valor_por_jornada:0,config_por_vuelta:[],valor_default_por_vuelta:0}
    }};
}
function _tarifarioFromLegacy(ct){
  function aC(val,tipo){return{incluido_en_base:!(val>0),tipo_cobro:tipo||'por_vuelta',
    valor_por_jornada:tipo==='por_jornada'?(val||0):0,config_por_vuelta:[],
    valor_default_por_vuelta:tipo!=='por_jornada'?(val||0):0};}
  var f=ct.factores||{};
  return{valor_base:ct.valor_base||0,comp_b:f.B||[],comp_c:f.C||[],comp_d:f.D||[],
    comp_e:{ayudante:aC(ct.valor_ayudante,ct.tipo_ayudante),
      ayudante_adicional:aC(ct.valor_ayudante_adicional,ct.tipo_ayudante_adicional)}};
}
function _ctMigrateOldFormat(){
  if(_ctEdit.tipo_identificacion)return;
  _ctEdit.tipo_identificacion='generico';
  _ctEdit.diferencia_por_carga=false;
  _ctEdit.tipo_base=_ctEdit.tipo_base||_ctEdit.tipo_tarifa||'por_vuelta';
  _ctEdit.formato_prefactura=_ctEdit.formato_prefactura||{modo_linea:'por_vuelta'};
  if(!_ctEdit.tarifario_generico)_ctEdit.tarifario_generico=_tarifarioFromLegacy(_ctEdit);
  if(!_ctEdit.rutas)_ctEdit.rutas=[];
}
function _resolverTarifario(svc,ct){
  var tiId=ct.tipo_identificacion;
  if(!tiId||tiId==='generico'){
    return ct.tarifario_generico||_tarifarioFromLegacy(ct);
  }
  var ruta=(ct.rutas||[]).find(function(r){
    return r.origen===svc.ruta_origen&&
      (r.destinos||[]).some(function(d){return d.nombre===svc.ruta_destino;});
  });
  if(!ruta)return null;
  var ts=ruta.tarifarios||[];
  if(!ct.diferencia_por_carga){
    // Busca tipo_carga===null (formato moderno) o undefined (legado); si no existe usa ts[0]
    var tGen=ts.find(function(t){return t.tipo_carga===null||t.tipo_carga===undefined;});
    return tGen?tGen.componentes:(ts[0]?ts[0].componentes:null);
  }
  var tc=svc.tipo_de_carga||'seca';
  var tm=ts.find(function(t){return t.tipo_carga===tc;});
  return tm?tm.componentes:null;
}
function _calcAyuE(conf,tuvo,vNum){
  if(!conf||conf.incluido_en_base||!tuvo||conf.tipo_cobro==='por_jornada')return 0;
  var cfg=(conf.config_por_vuelta||[]).find(function(c){return c.numero_vuelta===vNum;});
  return cfg?cfg.valor:(Number(conf.valor_default_por_vuelta)||0);
}
function _getCtAyuConfig(ct){
  var tar=ct.tarifario_generico;
  if(tar&&tar.comp_e){
    var a=tar.comp_e.ayudante||{},a2=tar.comp_e.ayudante_adicional||{};
    return{
      tipoAyu:a.incluido_en_base?null:(a.tipo_cobro||'por_vuelta'),
      valAyu:a.incluido_en_base?0:(a.tipo_cobro==='por_jornada'?(a.valor_por_jornada||0):(a.valor_default_por_vuelta||0)),
      tipoAyu2:a2.incluido_en_base?null:(a2.tipo_cobro||'por_vuelta'),
      valAyu2:a2.incluido_en_base?0:(a2.tipo_cobro==='por_jornada'?(a2.valor_por_jornada||0):(a2.valor_default_por_vuelta||0)),
      compE:tar.comp_e};
  }
  return{tipoAyu:ct.tipo_ayudante||'por_vuelta',valAyu:Number(ct.valor_ayudante)||0,
    tipoAyu2:ct.tipo_ayudante_adicional||'por_vuelta',valAyu2:Number(ct.valor_ayudante_adicional)||0,compE:null};
}

/* Restaura _ctActiveTar al tarifario correcto dado un tarId.
   tarId puede ser undefined (genérico), 'ruta-{id}' (OD sin cargo diff)
   o 'ruta-{id}-{tipoFardo}' (OD con diferencia_por_carga). */
function _ctRestoreActiveTar(tarId){
  if(!tarId){_ctActiveTar=_ctEdit.tarifario_generico;return;}
  var tipos=['seca','refrigerada','congelada','mixta'];
  var noRuta=tarId.slice(5);// quitar 'ruta-'
  var tc=null;
  for(var i=0;i<tipos.length;i++){
    if(noRuta.endsWith('-'+tipos[i])){tc=tipos[i];noRuta=noRuta.slice(0,noRuta.length-tipos[i].length-1);break;}
  }
  var ruta=(_ctEdit.rutas||[]).find(function(r){return r.id===noRuta;});
  if(!ruta){_ctActiveTar=_ctEdit.tarifario_generico;return;}
  var existT=(ruta.tarifarios||[]).find(function(t){return t.tipo_carga===tc;});
  _ctActiveTar=existT?existT.componentes:_ctEdit.tarifario_generico;
}

function ctTarSave(k,rid){
  if(!_ctActiveTar)return;
  var val=Number((document.getElementById('ctf-val')||{}).value)||0;
  if(!val){alert('El valor adicional es obligatorio.');return;}
  var rule={id:rid||('t'+Date.now()),valor:val};
  if(k==='A'){var o=((document.getElementById('ctf-a1')||{}).value||'').trim(),d=((document.getElementById('ctf-a2')||{}).value||'').trim();if(!o||!d){alert('Ruta origen y destino obligatorios.');return;}rule.origen=o;rule.destino=d;}
  else if(k==='B'){
    var bmode=((document.getElementById('ctf-b-mode')||{}).value||'B');
    var btv=((document.getElementById('ctf-b-tv')||{}).value||'fijo');
    if(bmode==='C'){
      var bnv2=(document.getElementById('ctf-b-nv')||{}).value;
      if(!bnv2){alert('N° de vuelta específica es obligatorio.');return;}

    }else{
      var bd=Number((document.getElementById('ctf-b-d')||{}).value)||1,bh=(document.getElementById('ctf-b-h')||{}).value;
      if(!bd){alert('Vueltas desde es obligatorio.');return;}
      rule.vueltas_desde=bd;rule.vueltas_hasta=bh?Number(bh):null;rule.tipo_valor=btv;
    }
  }
  else if(k==='C'){
    var nv=((document.getElementById('ctf-c-nv')||{}).value||'').trim();
    var sd=Number((document.getElementById('ctf-c-sd')||{}).value)||0,sh=Number((document.getElementById('ctf-c-sh')||{}).value)||0;
    var tp=((document.getElementById('ctf-c-tp')||{}).value||'fijo');
    if(!sd||!sh){alert('Sucursales desde y hasta obligatorios.');return;}
    rule.numero_vuelta=nv?Number(nv):null;rule.suc_desde=sd;rule.suc_hasta=sh;rule.tipo=tp;
  }
  else if(k==='D'){var kd=Number((document.getElementById('ctf-d1')||{}).value)||0,kh2=(document.getElementById('ctf-d2')||{}).value;rule.km_desde=kd;rule.km_hasta=kh2?Number(kh2):null;}
  var compKey='comp_'+k.toLowerCase();
  if(!_ctActiveTar[compKey])_ctActiveTar[compKey]=[];
  if(rid){var idx=_ctActiveTar[compKey].findIndex(function(x){return x.id===rid;});if(idx>=0)_ctActiveTar[compKey][idx]=rule;}

function _ctFactorLabel(k,r){
  if(k==='A')return 'Ruta: '+escH(r.origen||'')+' → '+escH(r.destino||'');
  if(k==='B'){
    var tv2=(r.tipo_valor||'fijo')==='por_vuelta'?'× vuelta':'fijo';
    if(r.numero_vuelta!=null)return 'Vuelta N°'+r.numero_vuelta+' — $'+Number(r.valor).toLocaleString('es-CL')+' '+tv2;
    var vd=r.vueltas_desde!=null?r.vueltas_desde:r.desde;
    var vh=r.vueltas_hasta!=null?r.vueltas_hasta:r.hasta;
    return 'De '+(vd||1)+(vh?' a '+vh:' en adelante')+' vueltas — $'+Number(r.valor).toLocaleString('es-CL')+' '+tv2;
  }
  if(k==='C'){
    var nv=r.numero_vuelta!=null?'Vuelta '+r.numero_vuelta+'°':'Todas las vueltas';
    var rango='Sucs '+r.suc_desde+' – '+(r.suc_hasta!=null?r.suc_hasta:'∞');
    var tv=r.tipo==='por_punto'?'$'+Number(r.valor).toLocaleString('es-CL')+' × puntos':'Fijo $'+Number(r.valor).toLocaleString('es-CL');
    return nv+' · '+rango+' · '+tv;
  }
  if(k==='D')return 'De '+r.km_desde+(r.km_hasta?' a '+r.km_hasta:' en adelante')+' km';
  return '';
}

async function migrarCamposPhase1(){
  var jSinMigrar=DB.jornadas.filter(function(j){return !j._p1migrado;});
  if(!jSinMigrar.length){alert('Todas las jornadas ya tienen los campos de Fase 1.');return;}
  if(!confirm('Se agregarán campos empresaId, estado_facturacion y valores por defecto en vueltas a '+jSinMigrar.length+' jornadas. ¿Continuar?'))return;
  setLoading('Migrando datos Fase 1...',10);
  try{
    var batches=[],cur=fbdb.batch(),n=0;
    jSinMigrar.forEach(function(j){
      if(!j.empresaId)j.empresaId=TENANT_ID;
      if(!j.estado_facturacion)j.estado_facturacion='pendiente';
      if(!j.numero_documento)j.numero_documento=null;
      (j.vueltas||[]).forEach(function(v){
        if(v.tuvo_ayudante===undefined)v.tuvo_ayudante=false;
        if(v.tuvo_ayudante_adicional===undefined)v.tuvo_ayudante_adicional=!!(v.ayu2&&v.ayu2.trim());
        if(!v.ruta_origen)v.ruta_origen=v.zona_origen||null;
        if(!v.ruta_destino)v.ruta_destino=v.zona_destino||null;
        if(!v.tipo_de_carga)v.tipo_de_carga='seca';
      });
      j._p1migrado=true;
      cur.set(fbdb.collection('tenants').doc(TENANT_ID).collection('jornadas').doc(String(j.id)),JSON.parse(JSON.stringify(j)));
      n++;if(n%200===0){batches.push(cur);cur=fbdb.batch();}
    });
    batches.push(cur);
    for(var i=0;i<batches.length;i++){
      setLoading('Migrando...',10+Math.round(i/batches.length*80));
      await batches[i].commit();
    }
    setLoading('Listo',100);setTimeout(hideLoading,500);
    alert('✓ '+jSinMigrar.length+' jornadas migradas.');
    renderFact();
  }catch(e){hideLoading();alert('Error: '+e.message);console.error(e);}
}
async function migrarClienteIdJornadas(){

  if(DB.clientes.length>1){alert('Hay múltiples clientes. Asigná el cliente manualmente a cada jornada desde Registros.');return;}

    }

    renderFact();
  }catch(e){hideLoading();alert('Error: '+e.message);console.error(e);}
}

async function migrarClienteDuplicado(idAntiguo, idCorrecto){
  var clAntiguo=DB.clientes.find(function(c){return c.id===idAntiguo;});
  var clCorrecto=DB.clientes.find(function(c){return c.id===idCorrecto;});
  if(!clAntiguo){alert('Cliente antiguo no encontrado: '+idAntiguo);return;}
  if(!clCorrecto){alert('Cliente correcto no encontrado: '+idCorrecto);return;}
  if(idAntiguo===idCorrecto){alert('Los dos IDs son iguales.');return;}
  var afectadas=DB.jornadas.filter(function(j){return j.clienteId===idAntiguo;});
  var afectadasContratos=DB.contratos.filter(function(ct){return ct.clienteId===idAntiguo;});
  var msg='MIGRACIÓN DE CLIENTE DUPLICADO\n\n'+
    'De: "'+clAntiguo.nombre+'" ('+idAntiguo+')\n'+
    'A:  "'+clCorrecto.nombre+'" ('+idCorrecto+')\n\n'+
    'Jornadas a reasignar: '+afectadas.length+'\n'+
    'Contratos a reasignar: '+afectadasContratos.length+'\n\n'+
    'El cliente antiguo quedará marcado como _duplicado:true (no se eliminará).\n\n'+
    '¿Confirmar?';
  if(!confirm(msg))return;
  setLoading('Migrando jornadas...',5);
  try{
    // Reasignar jornadas en Firestore y en DB local
    var batches=[],cur=fbdb.batch(),n=0;
    afectadas.forEach(function(j){
      cur.update(fbdb.collection('tenants').doc(TENANT_ID).collection('jornadas').doc(String(j.id)),{clienteId:idCorrecto});
      n++;if(n%400===0){batches.push(cur);cur=fbdb.batch();n=0;}
    });
    batches.push(cur);
    for(var i=0;i<batches.length;i++){
      setLoading('Migrando jornadas...',5+Math.round(i/batches.length*70));
      await batches[i].commit();
    }
    // Apply local mutations only after all Firestore commits succeed
    afectadas.forEach(function(j){j.clienteId=idCorrecto;});
    // Reasignar contratos en DB local y guardar config
    setLoading('Migrando contratos...',80);
    afectadasContratos.forEach(function(ct){ct.clienteId=idCorrecto;});
    // Marcar cliente duplicado como inactivo (no eliminar)
    clAntiguo._duplicado=true;
    clAntiguo._duplicadoDe=idCorrecto;
    clAntiguo._duplicadoAt=Date.now();
    saveConfig();
    setLoading('Listo',100);setTimeout(hideLoading,800);
    alert('✓ Migración completada.\n'+afectadas.length+' jornadas y '+afectadasContratos.length+' contratos reasignados a "'+clCorrecto.nombre+'".');
  }catch(e){hideLoading();alert('Error durante la migración: '+e.message);console.error(e);}
}

/* ── calcularValorServicio — Fase 2 ── */
// svc: vuelta/jornada object con ruta_origen, ruta_destino, tipo_de_carga, num, sucs, kmrec/kmTotal, tuvo_ayudante, tuvo_ayudante_adicional
// jornadaCtx: jornada padre (para fallback de total vueltas)
// contrato: objeto contrato (nuevo modelo o legacy)
// totalVueltasServicio: total de vueltas del documento (Fase 3+); si null, usa conteo de jornada
function calcularValorServicio(svc,jornadaCtx,contrato,totalVueltasServicio){
  var tar=_resolverTarifario(svc,contrato);
  if(!tar)return{valor_base:0,adicionales:[],ayudante:0,ayudante_adicional:0,total:0,sinTarifario:true};
  var base=Number(tar.valor_base)||0;
  var adicionales=[];
  var tipoBase=contrato.tipo_base||contrato.tipo_tarifa||'por_vuelta';
  // Comp A
  var comp_a={tipo:tipoBase,valor:base,
    racional:'Tarifa base '+(tipoBase==='por_servicio'?'por servicio':'por vuelta')+': $'+Number(base).toLocaleString('es-CL')};
  // Comp B: vueltas en el servicio
  var totalV=totalVueltasServicio!=null?totalVueltasServicio:
    (jornadaCtx.vueltas||[]).filter(function(v){return v.fase3Done;}).length;
  var comp_b={aplica:false,regla:null,valor:0,racional:'Sin regla para '+totalV+' vueltas en el servicio'};
  if(tar.comp_b&&tar.comp_b.length&&totalV){
    var svcNum=svc.num!=null?svc.num:null;
    var rulesC=tar.comp_b.filter(function(r){return r.numero_vuelta!=null;});
    var hasModoC=rulesC.length>0;
    var rulesB_sorted=tar.comp_b.filter(function(r){return r.numero_vuelta==null;})
      .slice().sort(function(a,b){
        var ad=a.vueltas_desde!=null?a.vueltas_desde:(a.desde||1);
        var bd=b.vueltas_desde!=null?b.vueltas_desde:(b.desde||1);
        return ad-bd;
      });
    if(hasModoC){
      if(svcNum!=null){
        var rCm=rulesC.find(function(r){return r.numero_vuelta===svcNum;});
        if(rCm){
          var mCm=(rCm.tipo_valor||'fijo')==='por_vuelta'?rCm.valor*totalV:rCm.valor;
          adicionales.push({factor:'B',desc:'Vuelta '+svcNum+' (regla específica)',monto:mCm});
          comp_b={aplica:true,regla:rCm,valor:mCm,
            racional:'Vuelta '+svcNum+' — regla Modo C · $'+Number(mCm).toLocaleString('es-CL')};
        }
      }else{
        var totalMC=0,apMC=false,racMC=[];
        for(var vi=1;vi<=totalV;vi++){
          var rCi=rulesC.find(function(r){return r.numero_vuelta===vi;});
          if(rCi){
            var mCi=(rCi.tipo_valor||'fijo')==='por_vuelta'?rCi.valor*totalV:rCi.valor;
            totalMC+=mCi;apMC=true;
            racMC.push('v'+vi+': $'+Number(mCi).toLocaleString('es-CL'));
          }
        }
        if(apMC){
          adicionales.push({factor:'B',desc:totalV+' vueltas (Modo C)',monto:totalMC});
          comp_b={aplica:true,regla:null,valor:totalMC,
            racional:'Modo C — '+racMC.join(' + ')+' = $'+Number(totalMC).toLocaleString('es-CL')};
        }
      }
    }else{
      var rBs=rulesB_sorted.find(function(r){
        var vd=r.vueltas_desde!=null?r.vueltas_desde:(r.desde||1);
        var vh=r.vueltas_hasta!=null?r.vueltas_hasta:r.hasta;
        return totalV>=vd&&(vh==null||totalV<=vh);
      });
      if(rBs){
        var mBs=(rBs.tipo_valor||'fijo')==='por_vuelta'?rBs.valor*totalV:rBs.valor;
        var vdBs=rBs.vueltas_desde!=null?rBs.vueltas_desde:(rBs.desde||1);
        var vhBs=rBs.vueltas_hasta!=null?rBs.vueltas_hasta:rBs.hasta;
        var tvBs=(rBs.tipo_valor||'fijo')==='por_vuelta';
        adicionales.push({factor:'B',desc:totalV+' vuelta'+(totalV!==1?'s':''),monto:mBs});
        comp_b={aplica:true,regla:rBs,valor:mBs,
          racional:totalV+' vuelta'+(totalV!==1?'s':'')+' en servicio, rango '+vdBs+(vhBs?' – '+vhBs:' en adelante')+
            (tvBs?' · $'+Number(rBs.valor).toLocaleString('es-CL')+'×'+totalV+' = $'+Number(mBs).toLocaleString('es-CL'):' · Fijo $'+Number(mBs).toLocaleString('es-CL'))};
      }
    }
  }
  // Comp C: sucursales
  var numSucs=svc.sucs?svc.sucs.split(', ').filter(Boolean).length:(Number(svc.sucursales)||0);
  var nV=svc.num||null;
  var comp_c={aplica:false,regla:null,valor:0,racional:'Sin regla para '+(nV?'vuelta '+nV+', ':'')+numSucs+' sucs'};
  if(tar.comp_c&&tar.comp_c.length){
    var inC=function(r){return numSucs>=r.suc_desde&&(r.suc_hasta==null||numSucs<=r.suc_hasta);};
    var rC=tar.comp_c.find(function(r){return r.numero_vuelta===nV&&inC(r);});
    if(!rC)rC=tar.comp_c.find(function(r){return r.numero_vuelta==null&&inC(r);});
    if(rC){
      var mC=rC.tipo==='por_punto'?rC.valor*numSucs:rC.valor;
      adicionales.push({factor:'C',desc:(nV?'v'+nV+' · ':'')+numSucs+' sucs',monto:mC});
      comp_c={aplica:true,regla:rC,valor:mC,
        racional:(nV?'Vuelta '+nV+', ':'')+numSucs+' sucs'+
          (rC.tipo==='por_punto'?' · $'+Number(rC.valor).toLocaleString('es-CL')+'×'+numSucs+' = $'+Number(mC).toLocaleString('es-CL'):' · Fijo $'+Number(mC).toLocaleString('es-CL'))};
    }
  }
  // Comp D: km
  var km=Number(svc.kmrec||svc.kmTotal)||0;
  var comp_d={aplica:false,regla:null,valor:0,racional:'Sin regla para '+km+' km'};
  if(tar.comp_d&&tar.comp_d.length&&km){
    tar.comp_d.forEach(function(r){
      if(km>=r.km_desde&&(r.km_hasta==null||km<=r.km_hasta)){
        adicionales.push({factor:'D',desc:km+' km',monto:r.valor});
        if(!comp_d.aplica){
          comp_d={aplica:true,regla:r,valor:r.valor,
            racional:km+' km, rango '+r.km_desde+(r.km_hasta?' – '+r.km_hasta:' en adelante')+' · $'+Number(r.valor).toLocaleString('es-CL')};
        }else{comp_d.valor+=r.valor;comp_d.racional+=', +$'+Number(r.valor).toLocaleString('es-CL');}
      }
    });
  }
  // Comp E: ayudante por_vuelta (por_jornada se gestiona externamente en _pfCargarLineas)
  var eC=tar.comp_e||{};
  var ayu=_calcAyuE(eC.ayudante,svc.tuvo_ayudante,svc.num);
  var ayu2=_calcAyuE(eC.ayudante_adicional,svc.tuvo_ayudante_adicional,svc.num);
  function mkE(conf,tuvo,monto,vNum,tuvoFn){
    if(!tuvo)return{aplica:false,incluido_en_base:false,tipo_cobro:'',valor:0,racional:'No tuvo ayudante'};
    if(!conf||conf.incluido_en_base)return{aplica:false,incluido_en_base:true,tipo_cobro:'',valor:0,racional:'Incluido en tarifa base'};
    if(conf.tipo_cobro==='por_jornada')return{aplica:false,incluido_en_base:false,tipo_cobro:'por_jornada',valor:0,
      racional:'Por jornada $'+Number(conf.valor_por_jornada).toLocaleString('es-CL')+' (se acumula a nivel de jornada)'};
    var rac;
    if(vNum!=null){
      rac='Por vuelta N°'+vNum;
    }else{
      var jv=(jornadaCtx&&jornadaCtx.vueltas)||[];
      var nums=tuvoFn?jv.filter(tuvoFn).map(function(v){return v.num;}).filter(Boolean):[];
      rac=nums.length?'Vuelta'+(nums.length>1?'s':'')+' N°'+nums.join(', N°'):'Por vuelta';
    }
    return{aplica:true,incluido_en_base:false,tipo_cobro:conf.tipo_cobro||'por_vuelta',valor:monto,
      racional:rac+': $'+Number(monto).toLocaleString('es-CL')};
  }
  var comp_e={
    ayudante:mkE(eC.ayudante,svc.tuvo_ayudante,ayu,svc.num,function(v){return v.tuvo_ayudante!==false;}),
    ayudante_adicional:mkE(eC.ayudante_adicional,svc.tuvo_ayudante_adicional,ayu2,svc.num,function(v){return !!(v.tuvo_ayudante_adicional||(v.ayu2&&v.ayu2.trim()));})};
  var totalAd=adicionales.reduce(function(s,a){return s+a.monto;},0);
  return{valor_base:base,adicionales:adicionales,ayudante:ayu,ayudante_adicional:ayu2,
    total:base+totalAd+ayu+ayu2,
    componente_a:comp_a,componente_b:comp_b,componente_c:comp_c,componente_d:comp_d,componente_e:comp_e};
}

var _empLogoPending=null;
var _empLogoPendingAspect=null;
function empLogoChange(inp){
  var file=inp.files[0];if(!file)return;
  if(file.size>500*1024){alert('El archivo supera 500 KB. Usá un logo más pequeño o comprimilo antes.');inp.value='';return;}
  if(!/^image\/(png|jpeg)$/.test(file.type)){alert('Solo se aceptan PNG o JPG.');inp.value='';return;}
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      // Compress via canvas until base64 < 200 KB
      var maxB64=200*1024;
      var canvas=document.createElement('canvas');
      var scale=1,q=0.85;
      var b64;
      // First try at original size
      canvas.width=img.width;canvas.height=img.height;
      canvas.getContext('2d').drawImage(img,0,0);
      b64=canvas.toDataURL('image/jpeg',q);
      // Reduce scale/quality until under limit
      while(b64.length>maxB64&&scale>0.1){
        scale*=0.8;q=Math.max(0.5,q-0.05);
        canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        b64=canvas.toDataURL('image/jpeg',q);
      }
      _empLogoPending=b64;
      _empLogoPendingAspect=img.width/img.height;
      var prev=document.getElementById('emp-logo-preview');
      if(prev)prev.innerHTML='<div style="margin-top:4px"><img src="'+b64+'" style="max-height:60px;max-width:140px;border-radius:6px;border:0.5px solid rgba(0,0,0,.15);object-fit:contain"><span style="font-size:11px;color:#888;margin-left:8px">Preview — se guardará al hacer clic en "Guardar"</span></div>';
      var lbl=document.getElementById('emp-logo-lbl');if(lbl)lbl.textContent='Logo listo ('+Math.round(b64.length/1024)+' KB) — guardá para confirmar';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtRut(v){
  v=String(v||'').replace(/[^0-9kK]/g,'').toUpperCase();
  if(v.length<=1)return v;
  var body=v.slice(0,-1),dv=v.slice(-1);
  body=body.split('').reverse().join('').replace(/(\d{3})(?=\d)/g,'$1.').split('').reverse().join('');
  return body+'-'+dv;
}
function fmtTel(v){
  v=String(v||'').replace(/[^0-9]/g,'');
  if(v.startsWith('56'))v=v.slice(2);
  if(v.startsWith('0'))v=v.slice(1);
  v=v.slice(0,9);
  if(!v)return '';
  var r='+56';
  if(v.length>=1)r+=' '+v.slice(0,1);
  if(v.length>=2)r+=' '+v.slice(1,Math.min(5,v.length));
  if(v.length>=6)r+=' '+v.slice(5);
  return r;
}

    '</div>';

function _pfBack(){if(_pfWiz.step>1){_pfWiz.step--;_pfRenderStep();}}
function _pfNext(){
  if(_pfWiz.step===1){
    var num=((document.getElementById('pf-num')||{}).value||'').trim();
    var fecha=((document.getElementById('pf-fecha')||{}).value||'').trim();
    var cid=(document.getElementById('pf-cliente')||{}).value||'';
    var desde=((document.getElementById('pf-desde')||{}).value||'').trim();
    var hasta=((document.getElementById('pf-hasta')||{}).value||'').trim();
    var miss=[];
    if(!num)miss.push('Número');if(!fecha)miss.push('Fecha');
    if(!cid)miss.push('Cliente');if(!desde)miss.push('Período desde');if(!hasta)miss.push('Período hasta');
    if(miss.length){alert('Completa:\n• '+miss.join('\n• '));return;}
    _pfWiz.numero=num;_pfWiz.fechaEmision=fecha;_pfWiz.clienteId=cid;
    _pfWiz.periodoDesde=desde;_pfWiz.periodoHasta=hasta;_pfWiz.step=2;
  }else if(_pfWiz.step===2){
    var cid=(document.getElementById('pf-contrato-sel')||{}).value||'';
    if(!cid){alert('Seleccioná un contrato.');return;}
    if(_pfWiz.contratoId&&_pfWiz.contratoId!==cid&&_pfWiz.lineas.length){
      if(!confirm('Al cambiar el contrato se recalcularán los valores. ¿Continuar?'))return;
    }
    var _pfPeriodoKey=_pfWiz.periodoDesde+'|'+_pfWiz.periodoHasta;
    if(_pfWiz.contratoId!==cid||!_pfWiz.lineas.length||_pfWiz._periodoKey!==_pfPeriodoKey){
      _pfWiz.contratoId=cid;_pfWiz._periodoKey=_pfPeriodoKey;_pfWiz.lineas=_pfCargarLineas();
    }else{
      _pfWiz.contratoId=cid;
    }
    if(_pfWiz._savedItemIds){
      _pfWiz.lineas.forEach(function(l){
        l.checked=!l.disabled&&_pfWiz._savedItemIds.indexOf(l.id)!==-1;
      });
    }
    _pfWiz.step=3;
  }else if(_pfWiz.step===3){
    _pfWiz.lineas.forEach(function(l){if(l.disabled)return;var el=document.getElementById('pf-chk-'+l.id);if(el)l.checked=el.checked;});
    if(!_pfWiz.lineas.filter(function(l){return l.checked&&!l.disabled;}).length){alert('Seleccioná al menos un servicio.');return;}
    _pfWiz.step=4;
  }else if(_pfWiz.step===4){
    _pfWiz.lineas.filter(function(l){return l.checked;}).forEach(function(l){
      var el=document.getElementById('pf-v-'+l.id);
      if(!el)return;
      var v=Number(el.value)||0;
      var lBase=Object.assign({},l,{valorManual:null});
      l.valorManual=(v!==_pfEfectivo(lBase))?v:null;
    });
    _pfWiz.step=5;
  }else if(_pfWiz.step===5){
    _pfWiz.notas=((document.getElementById('pf-notas')||{}).value||'').trim();
    _pfWiz.step=6;
  }
  _pfRenderStep();
}

  if(cts.length===1&&!_pfWiz.contratoId)_pfWiz.contratoId=cts[0].id;
  var opts=cts.map(function(ct){

    _pfNavBtns(true,true);

function _pfCargarLineas(){
  var ct=DB.contratos.find(function(x){return x.id===_pfWiz.contratoId;});if(!ct)return[];
  // Normalize tipo_base for both old and new model
  var modoLinea=ct.tipo_base||ct.tipo_tarifa||'por_vuelta';
  var ayuCfg=_getCtAyuConfig(ct);
  var tipoAyu=ayuCfg.tipoAyu||'por_vuelta';
  var tipoAyu2=ayuCfg.tipoAyu2||'por_vuelta';
  var valAyu=ayuCfg.valAyu;
  var valAyu2=ayuCfg.valAyu2;
  var compE=ayuCfg.compE;

  function normFecha(f){
    if(!f)return'';
    f=String(f).trim();
    // DD-MM-YYYY → YYYY-MM-DD
    var m=f.match(/^(\d{2})-(\d{2})-(\d{4})$/);
    if(m)return m[3]+'-'+m[2]+'-'+m[1];
    return f;
  }
  var soloUnCliente=DB.clientes.length<=1;
  var jornadas=DB.jornadas.filter(function(j){
    var clienteOk=(!j.clienteId&&soloUnCliente)||j.clienteId===_pfWiz.clienteId;
    var fj=normFecha(j.fechaISO);
    var fechaOk=fj&&fj>=_pfWiz.periodoDesde&&fj<=_pfWiz.periodoHasta;
    return clienteOk&&j.estado==='cerrado'&&fechaOk;
  }).sort(function(a,b){return normFecha(a.fechaISO).localeCompare(normFecha(b.fechaISO));});
  var lineas=[];

  function _jDis(j){return j.estado_facturacion==='en_prefactura'&&(!_pfWiz.editId||j.prefactura_id!==_pfWiz.editId);}
  function makeExtra(id,desc,jornadaId,vuelaNum,j,val){
    var dis=_jDis(j);
    return{id:id,jornadaId:jornadaId,vuelaNum:vuelaNum,tipo:'extra',descripcion:desc,
      checked:!dis,disabled:dis,pfNumExistente:j.prefactura_num||'',
      valorCalc:val,valorManual:null,

  }

  if(modoLinea==='por_servicio'){
    jornadas.forEach(function(j){
      var vueltas=(j.vueltas||[]).filter(function(v){return v.fase3Done;});
      var anyAyu=!!(j.ayu&&j.ayu.trim());

      var ta2=tipoAyu2==='por_vuelta'?anyAyu2:false;

      var firstV=vueltas[0]||{};
      var svcAug=Object.assign({},j,{
        ruta_origen:firstV.ruta_origen||j.ruta_origen||null,
        ruta_destino:firstV.ruta_destino||j.ruta_destino||null,
        tipo_de_carga:firstV.tipo_de_carga||'seca',

      var calc=calcularValorServicio(svcAug,j,ct);
      var ayuEnLinea=(tipoAyu==='por_jornada'&&anyAyu?valAyu:0);
      var ayu2EnLinea=(tipoAyu2==='por_jornada'&&anyAyu2?valAyu2:0);
      var totalLinea=calc.total+ayuEnLinea+ayu2EnLinea;
      var taDisp=tipoAyu==='por_jornada'?anyAyu:ta;
      var ta2Disp=tipoAyu2==='por_jornada'?anyAyu2:ta2;
      var jDis=_jDis(j);
      lineas.push({id:String(j.id),jornadaId:j.id,vuelaNum:null,checked:!jDis,disabled:jDis,pfNumExistente:j.prefactura_num||'',
        valorCalc:totalLinea,valorManual:null,

        hr:j.hojaRuta,fecha:j.fecha,fechaISO:j.fechaISO,patente:j.pat,
        ruta_origen:svcAug.ruta_origen,ruta_destino:svcAug.ruta_destino,numero_vuelta:null,
        total_vueltas:vueltas.length,sucursales:null,km:j.kmTotal||0,
        tuvo_ayudante:taDisp,tuvo_ayudante_adicional:ta2Disp});
      if(tipoAyu==='por_vuelta'&&valAyu>0){
        vueltas.forEach(function(v){
          var tuvAyu=v.tuvo_ayudante!==undefined?v.tuvo_ayudante:!!(j.ayu&&j.ayu.trim());
          if(tuvAyu)lineas.push(makeExtra(j.id+'_xayu_'+v.num,'Ayudante — Vuelta N°'+v.num,j.id,v.num,j,valAyu));
        });
      }
      // tipoAyu2==='por_vuelta': ya incluido en calc.total via calcularValorServicio(ta2=anyAyu2)
    });
  }else{
    jornadas.forEach(function(j){
      var vueltas=(j.vueltas||[]).filter(function(v){return v.fase3Done;});
      var anyAyu=!!(j.ayu&&j.ayu.trim());
      var anyAyu2=vueltas.some(function(v){return v.tuvo_ayudante_adicional||!!(v.ayu2&&v.ayu2.trim());});
      vueltas.forEach(function(v){
        var numSucs=(v.sucs?v.sucs.split(', ').filter(Boolean).length:0)+((v.entregas_adhoc||[]).length);
        var tuvAyu=v.tuvo_ayudante!==undefined?v.tuvo_ayudante:anyAyu;
        var ta=tipoAyu==='por_vuelta'?tuvAyu:false;
        var ta2=tipoAyu2==='por_vuelta'?!!(v.tuvo_ayudante_adicional||(v.ayu2&&v.ayu2.trim())):false;
        var svcAug=Object.assign({},v,{tuvo_ayudante:ta,tuvo_ayudante_adicional:ta2});
        var calc=calcularValorServicio(svcAug,j,ct);

          valorCalc:calc.total,valorManual:null,
          calcData:calc,ayuJornadaBaked:0,ayu2JornadaBaked:0,
          hr:v.hojaRuta||j.hojaRuta,fecha:j.fecha,fechaISO:j.fechaISO,patente:j.pat,
          ruta_origen:v.ruta_origen||null,ruta_destino:v.ruta_destino||null,
          numero_vuelta:v.num,total_vueltas:vueltas.length,
          sucursales:numSucs,km:v.kmrec||0,
          tuvo_ayudante:tipoAyu==='por_vuelta'?tuvAyu:(tipoAyu==='por_jornada'?false:tuvAyu),
          tuvo_ayudante_adicional:!!(v.tuvo_ayudante_adicional||(v.ayu2&&v.ayu2.trim()))});
      });

        lineas.push(makeExtra(j.id+'_xayu','Ayudante — Jornada '+j.fecha,j.id,null,j,valAyu));
      if(tipoAyu2==='por_jornada'&&valAyu2>0&&anyAyu2)
        lineas.push(makeExtra(j.id+'_xayu2','Ay. adicional — Jornada '+j.fecha,j.id,null,j,valAyu2));
    });
  }
  return lineas;
}
function _pfVuelStr(obj){
  if(obj.tipo==='extra')return obj.vuelaNum!=null?String(obj.vuelaNum):'—';
  if(obj.numero_vuelta!=null)return String(obj.numero_vuelta);
  var jj=DB.jornadas.find(function(x){return x.id===obj.jornadaId;});

  return obj.total_vueltas?'1–'+obj.total_vueltas:'—';
}

function _pfEfectivo(l){
  if(l.valorManual!==null&&l.valorManual!==undefined)return l.valorManual;
  if(!l.calcData)return l.valorCalc;
  var comps=(_pfWiz&&_pfWiz.comps)||{B:true,C:true,D:true,E:true};
  var cd=l.calcData;
  var v=cd.componente_a?cd.componente_a.valor||0:cd.valor_base||0;
  if(comps.B&&cd.componente_b)v+=cd.componente_b.valor||0;
  if(comps.C&&cd.componente_c)v+=cd.componente_c.valor||0;
  if(comps.D&&cd.componente_d)v+=cd.componente_d.valor||0;
  if(comps.E){
    if(cd.componente_e){
      v+=cd.componente_e.ayudante?cd.componente_e.ayudante.valor||0:0;
      v+=cd.componente_e.ayudante_adicional?cd.componente_e.ayudante_adicional.valor||0:0;
    }
    v+=l.ayuJornadaBaked||0;
    v+=l.ayu2JornadaBaked||0;
  }
  return v;

async function _pfMarcarJornadas(items, estado, pfNum, pfId){
  var ids=[];
  (items||[]).forEach(function(it){if(it.jornadaId&&ids.indexOf(it.jornadaId)===-1)ids.push(it.jornadaId);});
  if(!ids.length)return;
  var del=firebase.firestore.FieldValue.delete();
  for(var ci=0;ci<ids.length;ci+=499){
    var chunk=ids.slice(ci,ci+499);
    var batch=fbdb.batch();
    chunk.forEach(function(jid){
      var j=DB.jornadas.find(function(x){return x.id===jid;});if(!j)return;
      j.estado_facturacion=estado;
      var upd={estado_facturacion:estado};
      if(estado==='en_prefactura'){
        j.prefactura_num=pfNum;j.prefactura_id=pfId;
        upd.prefactura_num=pfNum;upd.prefactura_id=pfId;
      }else{
        delete j.prefactura_num;delete j.prefactura_id;
        upd.prefactura_num=del;upd.prefactura_id=del;
      }
      batch.update(fbdb.collection('tenants').doc(TENANT_ID).collection('jornadas').doc(String(jid)),upd);
    });
    await batch.commit();
  }
}
